                        <li><code>TEPAT_TIDAK_TEPAT</code> / <code>TEPAT</code>: Tepat / Tidak Tepat (Kunci: T,TT,T atau Tepat,Tidak Tepat,Tepat)</li>
                        <li><code>MCQ_COMPLEX</code>: Pilihan Ganda Kompleks (Kunci: A,B,C)</li>
                    </ul>
                </div>

                <div class="upload-dropzone" onclick="document.getElementById('excelFileInput').click()">
                    <i class="ph ph-file-arrow-up text-primary" style="font-size: 2.5rem;"></i>
                    <div class="font-bold text-sm mt-2">Pilih File Excel Anda</div>
                    <div class="text-xs text-muted mt-1">Klik di sini untuk mencari file (.xlsx, .xls, .csv)</div>
                    <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" style="display: none;" onchange="handleExcelFile(event)">
                </div>

                <div id="importPreviewArea"></div>
            </div>
        `);
    };

    window.handleExcelFile = function(e) {
        const file = e.target.files[0];
        if (!file) return;

        if (typeof XLSX === 'undefined') {
            UI.showToast('Library Excel belum siap. Silakan refresh halaman.', 'error');
            return;
        }

        const previewEl = document.getElementById('importPreviewArea');
        if (previewEl) {
            previewEl.innerHTML = `
                <div class="text-center p-4">
                    <div class="spinner mb-2"></div>
                    <p class="text-xs mt-2">Menganalisis baris soal dalam file Excel...</p>
                </div>
            `;
        }

        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const data = new Uint8Array(evt.target.result);
                const wb = XLSX.read(data, {type: 'array'});
                const firstSheetName = wb.SheetNames[0];
                const ws = wb.Sheets[firstSheetName];
                const rows = XLSX.utils.sheet_to_json(ws, {header: 1});

                if (!rows || rows.length <= 1) {
                    if (previewEl) {
                        previewEl.innerHTML = `<div class="card p-3 text-error text-center text-xs">File Excel kosong atau tidak memiliki baris data.</div>`;
                    }
                    return;
                }

                // Detect header row
                let headerRowIndex = -1;
                for (let i = 0; i < Math.min(rows.length, 5); i++) {
                    const rStr = (rows[i] || []).join(' ').toLowerCase();
                    if (rStr.includes('tipe') || rStr.includes('soal') || rStr.includes('kunci') || rStr.includes('pertanyaan')) {
                        headerRowIndex = i;
                        break;
                    }
                }
                if (headerRowIndex === -1) headerRowIndex = 0;

                const headerRow = (rows[headerRowIndex] || []).map(c => String(c || '').trim().toLowerCase());
                
                // Robust column finder: exact match first, then substring match with strict exclusions
                const getCol = (exactList, substringList, excludeList = []) => {
                    // 1. Check exact matches first
                    for (let i = 0; i < headerRow.length; i++) {
                        const h = headerRow[i];
                        if (excludeList.some(ex => h.includes(ex))) continue;
                        if (exactList.includes(h)) return i;
                    }
                    // 2. Check substring matches with exclusions
                    for (let i = 0; i < headerRow.length; i++) {
                        const h = headerRow[i];
                        if (excludeList.some(ex => h.includes(ex))) continue;
                        if (substringList.some(sub => h.includes(sub))) return i;
                    }
                    return -1;
                };

                const colType = getCol(
                    ['tipe soal', 'tipe', 'type', 'jenis soal', 'jenis'], 
                    ['tipe', 'type', 'jenis']
                );
                let colText = getCol(
                    ['teks pertanyaan', 'teks soal', 'pertanyaan', 'soal', 'isi soal', 'pertanyaan soal', 'question'], 
                    ['pertanyaan', 'teks', 'question'], 
                    ['tipe', 'type', 'gambar', 'image', 'foto', 'bobot', 'nilai', 'skor', 'nomor', 'no', 'kunci']
                );
                const colImg = getCol(
                    ['url gambar soal', 'url gambar', 'gambar soal', 'gambar', 'image', 'foto', 'link gambar', 'url foto'], 
                    ['gambar', 'image', 'foto']
                );
                const colBottom = getCol(
                    ['teks bawah gambar', 'teks lanjutan', 'teks soal bawah', 'teks bawah', 'bottom text'],
                    ['bawah gambar', 'teks lanjutan']
                );
                const colKey = getCol(
                    ['kunci jawaban', 'kunci', 'jawaban benar', 'kunci soal', 'key', 'answer'], 
                    ['kunci', 'key']
                );
                const colScore = getCol(
                    ['bobot nilai', 'bobot poin', 'bobot', 'poin', 'nilai', 'skor', 'score', 'points'], 
                    ['bobot', 'poin', 'skor'], 
                    ['metode', 'kunci']
                );
                const colOptA = getCol(
                    ['opsi a', 'pilihan a', 'opt a', 'a', 'jawaban a'], 
                    ['opsi a', 'pilihan a', 'opt a']
                );
                const colOptB = getCol(
                    ['opsi b', 'pilihan b', 'opt b', 'b', 'jawaban b'], 
                    ['opsi b', 'pilihan b', 'opt b']
                );
                const colOptC = getCol(
                    ['opsi c', 'pilihan c', 'opt c', 'c', 'jawaban c'], 
                    ['opsi c', 'pilihan c', 'opt c']
                );
                const colOptD = getCol(
                    ['opsi d', 'pilihan d', 'opt d', 'd', 'jawaban d'], 
                    ['opsi d', 'pilihan d', 'opt d']
                );
                const colOptE = getCol(
                    ['opsi e', 'pilihan e', 'opt e', 'e', 'jawaban e'], 
                    ['opsi e', 'pilihan e', 'opt e']
                );
                const colExp = getCol(
                    ['pembahasan', 'penjelasan', 'keterangan', 'explanation'], 
                    ['pembahasan', 'penjelasan', 'keterangan']
                );

                // Safety guard: colText and colType must NEVER be the same column
                if (colText === colType || colText === -1) {
                    colText = (colType === 1) ? 2 : 1;
                }

                const hasExplicitImgCol = colImg !== -1;
                const dataRows = rows.slice(headerRowIndex + 1);
                const parsed = [];

                dataRows.forEach((row, idx) => {
                    if (!row || row.length === 0) return;

                    const getVal = (colIdx, fallbackIdx) => {
                        const target = (colIdx !== -1) ? colIdx : fallbackIdx;
                        return (target !== -1 && target < row.length && row[target] !== undefined && row[target] !== null) 
                            ? String(row[target]).trim() 
                            : '';
                    };

                    const questionText = getVal(colText, 2);
                    if (!questionText) return;

                    const typeRaw = getVal(colType, 1).toUpperCase();
                    let type = 'MCQ';
                    let tfType = 'BENAR_SALAH';
                    if (typeRaw.includes('SESUAI')) {
                        type = 'TRUE_FALSE';
                        tfType = 'SESUAI_TIDAK';
                    } else if (typeRaw.includes('TEPAT')) {
                        type = 'TRUE_FALSE';
                        tfType = 'TEPAT_TIDAK';
                    } else if (typeRaw.includes('TRUE') || typeRaw.includes('SALAH') || typeRaw.includes('BENAR')) {
                        type = 'TRUE_FALSE';
                        tfType = 'BENAR_SALAH';
                    } else if (typeRaw.includes('KOMPLEKS') || typeRaw.includes('COMPLEX')) {
                        type = 'MCQ_COMPLEX';
                    }

                    // Auto-detect format from question text if TRUE_FALSE without explicit keyword in type
                    if (type === 'TRUE_FALSE' && tfType === 'BENAR_SALAH') {
                        const qLower = questionText.toLowerCase();
                        if (qLower.includes('tidak sesuai') || qLower.includes('sesuai atau tidak') || qLower.includes('sesuai/tidak')) {
                            tfType = 'SESUAI_TIDAK';
                        } else if (qLower.includes('tidak tepat') || qLower.includes('tepat atau tidak') || qLower.includes('tepat/tidak')) {
                            tfType = 'TEPAT_TIDAK';
                        }
                    }

                    // Handle options offset based on whether image column was present
                    const rawImg = hasExplicitImgCol ? getVal(colImg, -1) : '';
                    const bottomText = (colBottom !== -1) ? getVal(colBottom, -1) : '';
                    const optA = getVal(colOptA, hasExplicitImgCol ? 4 : 3);
                    const optB = getVal(colOptB, hasExplicitImgCol ? 5 : 4);
                    const optC = getVal(colOptC, hasExplicitImgCol ? 6 : 5);
                    const optD = getVal(colOptD, hasExplicitImgCol ? 7 : 6);
                    const optE = getVal(colOptE, hasExplicitImgCol ? 8 : 7);
                    const rawKey = getVal(colKey, hasExplicitImgCol ? 9 : 8) || 'A';
                    const score = Number(getVal(colScore, hasExplicitImgCol ? 10 : 9)) || 10;
                    const explanation = getVal(colExp, hasExplicitImgCol ? 11 : 10);

                    let options = [];
                    let correctAnswer = null;

                    if (type === 'TRUE_FALSE') {
                        const rawOptions = [optA, optB, optC, optD, optE].filter(o => o && String(o).trim());
                        let statements = [];

                        // Check if legacy Excel where optA='Benar' & optB='Salah'
                        if (rawOptions.length === 2 && 
                            (rawOptions[0].trim().toLowerCase() === 'benar' || rawOptions[0].trim().toLowerCase() === 'sesuai' || rawOptions[0].trim().toLowerCase() === 'tepat') && 
                            (rawOptions[1].trim().toLowerCase() === 'salah' || rawOptions[1].trim().toLowerCase() === 'tidak sesuai' || rawOptions[1].trim().toLowerCase() === 'tidak tepat')) {
                            statements.push({ id: '1', text: questionText });
                        } else if (rawOptions.length > 0) {
                            rawOptions.slice(0, 5).forEach((st, sIdx) => {
                                statements.push({ id: String(sIdx + 1), text: String(st).trim() });
                            });
                        } else {
                            statements.push({ id: '1', text: 'Pernyataan 1' });
                        }
                        options = statements;

                        // Parse keys e.g. "B,B,S" or "S,S,TS" or "T,T,TT" or full words
                        const keyTokens = String(rawKey || '').split(/[,; ]+/).filter(Boolean);
                        const keyMap = {};
                        const isSesuaiMode = tfType === 'SESUAI_TIDAK';
                        const isTepatMode = tfType === 'TEPAT_TIDAK';

                        statements.forEach((st, sIdx) => {
                            const tok = (keyTokens[sIdx] || keyTokens[0] || '').trim().toUpperCase();
                            let isTrue = true;
                            if (isSesuaiMode) {
                                // Sesuai (TRUE), Tidak Sesuai (FALSE)
                                if (tok === 'TS' || tok.includes('TIDAK') || tok === 'FALSE' || tok === 'SALAH' || tok === '0') {
                                    isTrue = false;
                                } else {
                                    isTrue = true;
                                }
                            } else if (isTepatMode) {
                                // Tepat (TRUE), Tidak Tepat (FALSE)
                                if (tok === 'TT' || tok.includes('TIDAK') || tok === 'FALSE' || tok === 'SALAH' || tok === '0') {
                                    isTrue = false;
                                } else {
                                    isTrue = true;
                                }
                            } else {
                                // Benar (TRUE), Salah (FALSE)
                                if (tok === 'S' || tok === 'SALAH' || tok === 'FALSE' || tok === '0') {
                                    isTrue = false;
                                } else {
                                    isTrue = true;
                                }
                            }
                            keyMap[st.id] = isTrue ? 'TRUE' : 'FALSE';
                        });
                        correctAnswer = keyMap;
                    } else if (type === 'MCQ_COMPLEX') {
                        if (optA) options.push({ id: 'A', text: optA, imageUrl: '' });
                        if (optB) options.push({ id: 'B', text: optB, imageUrl: '' });
                        if (optC) options.push({ id: 'C', text: optC, imageUrl: '' });
                        if (optD) options.push({ id: 'D', text: optD, imageUrl: '' });
                        if (optE) options.push({ id: 'E', text: optE, imageUrl: '' });
                        correctAnswer = rawKey.toUpperCase().split(/[,; ]+/).filter(Boolean);
                    } else {
                        if (optA) options.push({ id: 'A', text: optA, imageUrl: '' });
                        if (optB) options.push({ id: 'B', text: optB, imageUrl: '' });
                        if (optC) options.push({ id: 'C', text: optC, imageUrl: '' });
                        if (optD) options.push({ id: 'D', text: optD, imageUrl: '' });
                        if (optE) options.push({ id: 'E', text: optE, imageUrl: '' });
                        correctAnswer = rawKey.toUpperCase().charAt(0) || 'A';
                    }

                    parsed.push({
                        id: 'Q_' + Math.floor(Math.random() * 90000 + 10000),
                        type: type,
                        tfType: tfType,
                        text: questionText,
                        bottomText: bottomText,
                        imageUrl: formatDirectImageUrl(rawImg),
                        score: score,
                        options: options,
                        correctAnswer: correctAnswer,
                        scoringMethod: 'EXACT',
                        explanation: explanation
                    });
                });

                if (parsed.length === 0) {
                    if (previewEl) {
                        previewEl.innerHTML = `<div class="card p-3 text-error text-center text-xs">Tidak ditemukan baris soal yang valid dalam file Excel.</div>`;
                    }
                    return;
                }

                pendingImportQuestions = parsed;
                if (previewEl) {
                    previewEl.innerHTML = `
                        <div class="card p-3 mb-3" style="background: var(--primary-50); border-color: var(--primary-200);">
                            <div class="flex items-center gap-2 text-primary font-bold">
                                <i class="ph ph-check-circle" style="font-size: 1.25rem;"></i> Ditemukan ${parsed.length} Soal Valid
                            </div>
                            <p class="text-xs text-secondary mt-1">Total Poin: <strong>${parsed.reduce((a,c) => a + c.score, 0)}</strong> poin • Format terverifikasi.</p>
                        </div>
                        <div style="max-height: 160px; overflow-y: auto; font-size: 0.82rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 0.5rem; background: #ffffff;">
                            ${parsed.map((pq, pi) => `
                                <div class="py-1.5 px-2 flex justify-between items-center" style="border-bottom: 1px solid var(--border-color); gap: 0.5rem;">
                                    <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0;">
                                        <strong>#${pi+1}</strong> [${pq.type === 'TRUE_FALSE' ? getTfLabels(pq.tfType).name : pq.type}] ${escapeHtml(pq.text)}
                                    </span>
                                    <span class="badge badge-active text-xs" style="flex-shrink: 0;">${pq.score} Poin</span>
                                </div>
                            `).join('')}
                        </div>
                        <div style="padding: 1rem 0 3rem 0;">
                            <button id="confirmImportBtn" class="btn btn-primary w-full justify-center" onclick="confirmImportQuestions()" style="padding: 0.8rem 1rem; font-size: 0.95rem; font-weight: 600;">
                                <i class="ph ph-plus"></i> Tambahkan ${parsed.length} Soal ke Ujian
                            </button>
                        </div>
                    `;

                    setTimeout(() => {
                        const btn = document.getElementById('confirmImportBtn');
                        if (btn) btn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }, 120);
                }
            } catch (err) {
                console.error("Excel parse error:", err);
                if (previewEl) {
                    previewEl.innerHTML = `<div class="card p-3 text-error text-center text-xs">Gagal membaca file Excel: ${err.message}</div>`;
                }
            }
        };
        reader.readAsArrayBuffer(file);
    };

    window.confirmImportQuestions = function() {
        if (!pendingImportQuestions || pendingImportQuestions.length === 0) return;
        questions.push(...pendingImportQuestions);
        renderQuestionsList();
        UI.closeModal();
        UI.showToast(`Berhasil menambahkan ${pendingImportQuestions.length} soal dari Excel!`, 'success');
        pendingImportQuestions = [];

        // Scroll to the first newly added question
        setTimeout(() => {
            const cards = document.querySelectorAll('#questionsListContainer .question-card-item');
            if (cards.length > 0) {
                cards[cards.length - 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }, 150);
    };

    window.saveAllQuestions = async function() {
        const btn = document.getElementById('saveQuestionsBtn');
        const mBtn = document.getElementById('mSaveQuestionsBtn');
        if (btn) {
            btn.disabled = true;
            btn.innerHTML = '<i class="ph ph-spinner ph-spin"></i> Menyimpan...';
        }
        if (mBtn) {
            mBtn.disabled = true;
            mBtn.innerHTML = '<i class="ph ph-spinner ph-spin"></i>';
        }

        try {
            const res = await api.saveQuestions(AppState.user.sessionId, examId, questions);
            if (res.success) {
                UI.showToast('Semua soal berhasil disimpan ke database!', 'success');
            } else {
                UI.showToast(res.message || 'Gagal menyimpan soal.', 'error');
            }
        } catch (e) {
            UI.showToast('Terjadi kesalahan saat menyimpan.', 'error');
        } finally {
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = '<i class="ph ph-floppy-disk"></i> Simpan Soal';
            }
            if (mBtn) {
                mBtn.disabled = false;
                mBtn.innerHTML = '<i class="ph ph-floppy-disk"></i> Simpan';
            }
        }
    };

    document.addEventListener('viewRendered', function onRender(e) {
        if (e.detail.path === '/question-builder') {
            renderQuestionsList();
            document.removeEventListener('viewRendered', onRender);
        }
    });

    return `
        <div class="view">
            <nav class="navbar glass">
                <div class="container flex justify-between items-center" style="gap: 0.5rem; flex-wrap: wrap;">
                    <div class="flex items-center gap-3">
                        <button class="btn btn-icon btn-secondary" onclick="Router.navigate('/dashboard')" title="Kembali ke Dashboard">
                            <i class="ph ph-arrow-left"></i>
                        </button>
                        <h3 style="margin:0; font-size: 1.15rem; white-space: nowrap;">Kelola Soal</h3>
                    </div>
                    <div class="flex items-center gap-2" style="flex-wrap: wrap;">
                        <div class="teacher-profile-chip" title="${escapeHtml(AppState.user ? (AppState.user.teacherName || AppState.user.username || 'Guru') : 'Guru')}">
                            <i class="ph ph-user-circle"></i>
                            <span>${escapeHtml(AppState.user ? (AppState.user.teacherName || AppState.user.username || 'Guru') : 'Guru')}</span>
                        </div>
                        <button class="btn btn-outline-success btn-sm flex items-center gap-1.5" onclick="downloadCurrentQuestionsExcel()" title="Download seluruh soal ujian ini ke file Excel (.xlsx)">
                            <i class="ph ph-file-arrow-down text-success"></i> <span class="hidden sm-inline">Download Soal</span> Excel
                        </button>
                        <button class="btn btn-outline-primary btn-sm" onclick="openImportModal()">
                            <i class="ph ph-microsoft-excel-logo text-success"></i> <span class="hidden sm-inline">Import</span> Excel
                        </button>
                        <button id="saveQuestionsBtn" class="btn btn-primary btn-sm" onclick="saveAllQuestions()">
                            <i class="ph ph-floppy-disk"></i> Simpan
                        </button>
                    </div>
                </div>
            </nav>

            <div class="container mt-6">
                <style>
                    .qb-layout { display: grid; grid-template-columns: 1fr 280px; gap: 1.5rem; align-items: start; }
                    @media (max-width: 768px) {
                        .qb-layout { grid-template-columns: 1fr; }
                        .sidebar-tools { display: none !important; }
                    }
                </style>
                <div class="qb-layout">
                    <div id="questionsListContainer">
                        <!-- Rendered by JS -->
                    </div>
                    
                    <div class="card sidebar-tools" style="position: sticky; top: 100px;">
                        <h4 class="mb-3 text-sm font-semibold">Tambah Soal</h4>
                        <div class="flex-col gap-2">
                            <button class="btn btn-secondary justify-center w-full" onclick="addQuestion('MCQ')">
                                <i class="ph ph-list-bullets text-primary"></i> Pilihan Ganda
                            </button>
                            <button class="btn btn-secondary justify-center w-full" onclick="addQuestion('MCQ_COMPLEX')">
                                <i class="ph ph-check-square text-primary"></i> Ganda Kompleks
                            </button>
                            <button class="btn btn-secondary justify-center w-full" onclick="addQuestion('TRUE_FALSE')">
                                <i class="ph ph-toggle-left text-primary"></i> Benar / Salah
                            </button>
                            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 0.5rem 0;">
                            <button class="btn btn-outline-primary justify-center w-full" onclick="openImportModal()">
                                <i class="ph ph-microsoft-excel-logo text-success"></i> Import Excel
                            </button>
                            <button class="btn btn-outline-success justify-center w-full" onclick="downloadCurrentQuestionsExcel()">
                                <i class="ph ph-file-arrow-down text-success"></i> Download Soal (Excel)
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Mobile Sticky Floating Action Bar -->
            <div class="qb-mobile-floating-bar">
                <button class="btn btn-secondary" onclick="addQuestion('MCQ')">
                    <i class="ph ph-plus"></i> + Soal
                </button>
                <button class="btn btn-outline-success" onclick="downloadCurrentQuestionsExcel()" title="Download Soal">
                    <i class="ph ph-file-arrow-down"></i> Excel
                </button>
                <button class="btn btn-outline-primary" onclick="openImportModal()">
                    <i class="ph ph-microsoft-excel-logo text-success"></i> Import
                </button>
                <button id="mSaveQuestionsBtn" class="btn btn-primary" onclick="saveAllQuestions()">
                    <i class="ph ph-floppy-disk"></i> Simpan
                </button>
            </div>
        </div>
    `;
});

window.showStudentDetail = async function(attemptId) {
    if (!attemptId) return;

    UI.showModal(`
        <div class="text-center py-6">
            <i class="ph ph-spinner ph-spin text-primary" style="font-size: 2.5rem;"></i>
            <p class="mt-3 text-sm text-muted">Memuat rincian lembar jawaban siswa...</p>
        </div>
    `);

    try {
        const res = await api.getStudentAttemptDetail(AppState.user.sessionId, attemptId);
        if (!res.success || !res.data) {
            UI.showToast(res.message || 'Gagal memuat detail jawaban.', 'error');
            closeModal();
            return;
        }

        const data = res.data;
        const att = data.attempt || {};
        const qList = data.questions || [];

        const formatAnswerBadges = (rawAns, options, qType = null) => {
            if (rawAns === null || rawAns === undefined || rawAns === '') {
                if (qType === 'TRUE_FALSE') {
                    rawAns = 'FALSE';
                } else {
                    return '<span class="text-muted italic">- Belum dijawab -</span>';
                }
            }
            let list = [];
            if (Array.isArray(rawAns)) {
                list = rawAns;
            } else {
                const s = String(rawAns).trim();
                if (s.startsWith('[') && s.endsWith(']')) {
                    try {
                        const parsed = JSON.parse(s);
                        if (Array.isArray(parsed)) list = parsed;
                        else list = [s];
                    } catch (e) {
                        list = s.replace(/[\[\]"]/g, '').split(',').map(x => x.trim()).filter(Boolean);
                    }
                } else if (s.includes(',')) {
                    list = s.split(',').map(x => x.trim()).filter(Boolean);
                } else {
                    list = [s];
                }
            }

            if (list.length === 0) {
                return '<span class="text-muted italic">- Belum dijawab -</span>';
            }

            return list.map(ansId => {
                const cleanId = String(ansId).trim().replace(/^["']|["']$/g, '');
                const upperId = cleanId.toUpperCase();
                const opt = options ? options.find(o => String(o.id).trim().toUpperCase() === upperId) : null;
                if (opt) {
                    return `<span><strong>${escapeHtml(cleanId)}.</strong> ${escapeHtml(opt.text)}</span>`;
                }
                if (upperId === 'TRUE' || upperId === 'BENAR' || upperId === 'B' || upperId === 'SESUAI' || upperId === 'TEPAT') return '<span class="font-semibold text-success">TRUE. Benar/Sesuai/Tepat</span>';
                if (upperId === 'FALSE' || upperId === 'SALAH' || upperId === 'S' || upperId === 'TS' || upperId === 'TT' || upperId === 'TIDAK SESUAI' || upperId === 'TIDAK TEPAT') return '<span class="font-semibold text-error">FALSE. Salah/Tidak Sesuai</span>';
                return `<span><strong>${escapeHtml(cleanId)}</strong></span>`;
            }).join(' <span class="text-muted" style="margin: 0 4px;">•</span> ');
        };

        const questionsHtml = qList.map(q => {
            const isCorr = q.isCorrect;
            const tfLabels = getTfLabels(q.tfType);
            const typeLabel = q.type === 'MCQ' ? 'Pilihan Ganda' : (q.type === 'TRUE_FALSE' ? tfLabels.name : 'Pilihan Ganda Kompleks');

            const studentAnsText = formatAnswerBadges(q.studentAnswer, q.options, q.type);
            const keyText = formatAnswerBadges(q.correctAnswer, q.options, q.type);

            return `
                <div class="student-q-item ${isCorr ? 'correct-item' : 'wrong-item'}">
                    <div class="flex justify-between items-center mb-2" style="flex-wrap: wrap; gap: 0.5rem;">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-sm text-primary">Soal #${q.orderNo}</span>
                            <span class="badge text-xs" style="background: var(--bg-base);">${typeLabel}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="badge ${isCorr ? 'badge-active' : 'badge-archived'} text-xs">
                                ${isCorr ? '<i class="ph ph-check-circle"></i> BENAR' : '<i class="ph ph-x-circle"></i> SALAH'}
                            </span>
                            <span class="text-xs font-bold ${isCorr ? 'text-success' : 'text-error'}">
                                ${q.awardedScore} / ${q.score} Poin
                            </span>
                        </div>
                    </div>

                    <div class="text-sm font-medium mb-3" style="line-height: 1.5; color: var(--text-primary); word-break: break-word; overflow-wrap: anywhere;">
                        ${escapeHtml(q.questionText)}
                    </div>

                    ${(q.questionImageUrl || q.imageUrl) ? `
                        <div class="mb-3 text-center">
                            <img src="${formatDirectImageUrl(q.questionImageUrl || q.imageUrl)}" 
                                 alt="Gambar Soal" 
                                 referrerpolicy="no-referrer"
                                 loading="lazy"
                                 onerror="handleImgError(this)"
                                 style="max-width: 100%; max-height: 220px; object-fit: contain; border-radius: var(--radius-sm); border: 1px solid var(--border-color); background: #ffffff; display: inline-block;">
                        </div>
                    ` : ''}

                    ${q.bottomText ? `
                        <div class="text-sm font-medium mb-3" style="line-height: 1.5; color: var(--text-primary); word-break: break-word; overflow-wrap: anywhere;">
                            ${escapeHtml(q.bottomText)}
                        </div>
                    ` : ''}

                    ${q.type === 'TRUE_FALSE' ? (() => {
                        let sMap = {};
                        if (typeof q.studentAnswer === 'object' && q.studentAnswer !== null) {
                            sMap = q.studentAnswer;
                        } else if (typeof q.studentAnswer === 'string' && q.studentAnswer.trim().startsWith('{')) {
                            try { sMap = JSON.parse(q.studentAnswer); } catch (e) { sMap = {}; }
                        } else if (q.studentAnswer) {
                            sMap = { '1': q.studentAnswer };
                        }

                        let cMap = {};
                        if (typeof q.correctAnswer === 'object' && q.correctAnswer !== null) {
                            cMap = q.correctAnswer;
                        } else if (typeof q.correctAnswer === 'string' && q.correctAnswer.trim().startsWith('{')) {
                            try { cMap = JSON.parse(q.correctAnswer); } catch (e) { cMap = {}; }
                        } else if (q.correctAnswer) {
                            cMap = { '1': q.correctAnswer };
                        }

                        let statements = q.options || [];
                        if (statements.length === 2 && (statements[0].id === 'TRUE' || statements[0].text === 'Benar' || statements[0].text === 'Sesuai' || statements[0].text === 'Tepat')) {
                            statements = [{ id: '1', text: q.questionText }];
                        }

                        return `
                            <div style="overflow-x: auto; margin-top: 0.5rem; margin-bottom: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-md); background: #ffffff;">
                                <table style="width: 100%; border-collapse: collapse; font-size: 0.84rem; text-align: left;">
                                    <thead>
                                        <tr style="background: #e0f2fe; color: #0369a1; border-bottom: 2px solid #bae6fd;">
                                            <th style="padding: 8px 12px; width: 35px; text-align: center;">No</th>
                                            <th style="padding: 8px 12px;">Pernyataan</th>
                                            <th style="padding: 8px 12px; width: 110px; text-align: center;">Jawaban Siswa</th>
                                            <th style="padding: 8px 12px; width: 100px; text-align: center;">Kunci Resmi</th>
                                            <th style="padding: 8px 12px; width: 85px; text-align: center;">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${statements.map((st, sIdx) => {
                                            let sVal = (sMap && sMap[st.id] !== undefined) ? String(sMap[st.id]).trim().toUpperCase() : '';
                                            let cVal = (cMap && cMap[st.id] !== undefined) ? String(cMap[st.id]).trim().toUpperCase() : '';
                                            if (sVal === 'BENAR' || sVal === 'B' || sVal === 'SESUAI' || sVal === 'TEPAT' || sVal === '1') sVal = 'TRUE';
                                            if (sVal === 'SALAH' || sVal === 'S' || sVal === 'TS' || sVal === 'TT' || sVal === 'TIDAK SESUAI' || sVal === 'TIDAK TEPAT' || sVal === '0') sVal = 'FALSE';
                                            if (cVal === 'BENAR' || cVal === 'B' || cVal === 'SESUAI' || cVal === 'TEPAT' || cVal === '1') cVal = 'TRUE';
                                            if (cVal === 'SALAH' || cVal === 'S' || cVal === 'TS' || cVal === 'TT' || cVal === 'TIDAK SESUAI' || cVal === 'TIDAK TEPAT' || cVal === '0') cVal = 'FALSE';

                                            const isStmtCorrect = sVal && cVal && sVal === cVal;
                                            const sText = sVal === 'TRUE' ? `<span class="text-success font-semibold">${tfLabels.positive}</span>` : (sVal === 'FALSE' ? `<span class="text-error font-semibold">${tfLabels.negative}</span>` : '<span class="text-muted italic">-</span>');
                                            const cText = cVal === 'TRUE' ? `<span class="text-success font-semibold">${tfLabels.positive}</span>` : (cVal === 'FALSE' ? `<span class="text-error font-semibold">${tfLabels.negative}</span>` : '-');

                                            return `
                                                <tr style="border-bottom: 1px solid var(--border-color); background: ${sIdx % 2 === 0 ? '#ffffff' : 'var(--bg-base)'};">
                                                    <td style="padding: 8px 12px; text-align: center; font-weight: bold; color: var(--text-secondary); vertical-align: middle;">${sIdx + 1}</td>
                                                    <td style="padding: 8px 12px; vertical-align: middle; line-height: 1.45; color: var(--text-primary); font-weight: 500;">${escapeHtml(st.text)}</td>
                                                    <td style="padding: 8px 12px; text-align: center; vertical-align: middle;">${sText}</td>
                                                    <td style="padding: 8px 12px; text-align: center; vertical-align: middle;">${cText}</td>
                                                    <td style="padding: 8px 12px; text-align: center; vertical-align: middle;">
                                                        <span class="badge ${isStmtCorrect ? 'badge-active' : 'badge-archived'}" style="font-size: 0.72rem; padding: 2px 6px;">
                                                            ${isStmtCorrect ? '<i class="ph ph-check"></i> Tepat' : '<i class="ph ph-x"></i> Keliru'}
                                                        </span>
                                                    </td>
                                                </tr>
                                            `;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        `;
                    })() : `
                        <!-- Jawaban Siswa -->
                        <div class="ans-box ${isCorr ? 'ans-box-student-correct' : 'ans-box-student-wrong'}">
                            <div class="ans-icon-wrap">
                                <i class="ph ${isCorr ? 'ph-check-circle' : 'ph-x-circle'}" style="font-size: 1.25rem;"></i>
                            </div>
                            <div class="ans-content-wrap">
                                <div class="text-xs font-bold" style="text-transform: uppercase; letter-spacing: 0.04em;">Jawaban Siswa:</div>
                                <div class="font-medium mt-1" style="font-size: 0.92rem; line-height: 1.5;">${studentAnsText}</div>
                            </div>
                        </div>

                        <!-- Kunci Jawaban Resmi Guru -->
                        <div class="ans-box ans-box-key">
                            <div class="ans-icon-wrap">
                                <i class="ph ph-key" style="font-size: 1.25rem;"></i>
                            </div>
                            <div class="ans-content-wrap">
                                <div class="text-xs font-bold" style="text-transform: uppercase; letter-spacing: 0.04em;">Kunci Jawaban Resmi:</div>
                                <div class="font-medium mt-1" style="font-size: 0.92rem; line-height: 1.5;">${keyText}</div>
                            </div>
                        </div>
                    `}

                    ${q.explanation ? `
                        <div class="mt-2.5 p-2.5 text-xs" style="background: var(--bg-base); border-radius: var(--radius-sm); border-left: 3px solid var(--info); color: var(--text-secondary); line-height: 1.45;">
                            <strong class="text-primary">Pembahasan:</strong> ${escapeHtml(q.explanation)}
                        </div>
                    ` : ''}
                </div>
            `;
        }).join('');

        UI.showModal(`
            <div class="attempt-detail-modal">
                <div class="flex justify-between items-center mb-3 pb-3" style="position: sticky; top: 0; background: #ffffff; z-index: 10; border-bottom: 1px solid var(--border-color);">
                    <div>
                        <h3 style="margin: 0; font-size: 1.2rem; color: var(--text-primary);">Lembar Jawaban Siswa</h3>
                        <p class="text-xs text-muted mt-0.5">${att.examTitle || 'Ujian Online'}</p>
                    </div>
                    <button class="btn btn-icon btn-secondary btn-sm" onclick="closeModal()" title="Tutup">
                        <i class="ph ph-x"></i>
                    </button>
                </div>

                <!-- Ringkasan Nilai & Identitas Siswa -->
                <div class="student-summary-box">
                    <div class="flex justify-between items-center" style="flex-wrap: wrap; gap: 0.75rem;">
                        <div>
                            <div class="text-base font-bold text-primary">${att.participantName}</div>
                            <div class="text-xs text-muted mt-0.5">
                                NIS: <strong>${att.nis}</strong> • Kelas: <strong>${att.className}</strong>
                            </div>
                            <div class="text-xs text-muted mt-0.5">
                                Percobaan: <strong>Ke-${att.attemptNumber || 1}</strong> • ${att.endAt ? new Date(att.endAt).toLocaleTimeString('id-ID', {hour: '2-digit', minute: '2-digit'}) : '-'}
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="text-xs text-muted">Nilai (KKM: ${att.kkm || 75})</div>
                            <div class="text-3xl font-black ${att.finalScore >= (att.kkm || 75) ? 'text-success' : 'text-error'}" style="line-height: 1.1;">
                                ${att.finalScore !== null ? att.finalScore : 0}
                            </div>
                            <span class="badge ${att.passStatus === 'LULUS' ? 'badge-active' : 'badge-archived'} mt-1 text-xs">
                                ${att.passStatus || (att.finalScore >= (att.kkm || 75) ? 'LULUS' : 'BELUM LULUS')}
                            </span>
                        </div>
                    </div>

                    <div class="stats-grid grid grid-cols-3 gap-2 mt-3 pt-3 text-center" style="border-top: 1px solid var(--border-color);">
                        <div style="background: #ffffff; padding: 0.4rem 0.25rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color);">
                            <div class="text-xs text-muted">Total Benar</div>
                            <div class="font-bold text-success text-sm">${att.totalCorrect !== undefined ? att.totalCorrect : '-'} Soal</div>
                        </div>
                        <div style="background: #ffffff; padding: 0.4rem 0.25rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color);">
                            <div class="text-xs text-muted">Total Salah</div>
                            <div class="font-bold text-error text-sm">${att.totalWrong !== undefined ? att.totalWrong : '-'} Soal</div>
                        </div>
                        <div style="background: #ffffff; padding: 0.4rem 0.25rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color);">
                            <div class="text-xs text-muted">Total Soal</div>
                            <div class="font-bold text-secondary text-sm">${att.totalQuestions || qList.length} Soal</div>
                        </div>
                    </div>
                </div>

                <h4 class="mb-3 text-sm font-semibold flex items-center gap-2">
                    <i class="ph ph-list-checks text-primary"></i> Evaluasi per Butir Soal:
                </h4>

                <div class="questions-review-list">
                    ${questionsHtml}
                </div>

                <div class="flex justify-end mt-4 pt-3" style="border-top: 1px solid var(--border-color);">
                    <button class="btn btn-secondary w-full sm:w-auto justify-center" onclick="closeModal()">
                        Tutup Lembar Jawaban
                    </button>
                </div>
            </div>
        `);
    } catch (e) {
        console.error("showStudentDetail error:", e);
        UI.showToast('Gagal memuat rincian: ' + (e.message || e), 'error');
        closeModal();
    }
};

window.filterResultsTable = function(query) {
    const q = (query || '').toLowerCase();
    
    // Filter desktop table rows
    const table = document.getElementById('resultsTable');
    if (table) {
        const rows = table.querySelectorAll('tbody tr');
        rows.forEach(row => {
            const text = row.innerText.toLowerCase();
            row.style.display = text.includes(q) ? '' : 'none';
        });
    }

    // Filter mobile cards
    const mobileCards = document.querySelectorAll('.result-card-item');
    mobileCards.forEach(card => {
        const text = card.innerText.toLowerCase();
        card.style.display = text.includes(q) ? '' : 'none';
    });
};

(function() {

                (e.title && e.title.toLowerCase().includes(currentSearch.toLowerCase())) ||
                (e.material && e.material.toLowerCase().includes(currentSearch.toLowerCase())) ||
                (e.subject && e.subject.toLowerCase().includes(currentSearch.toLowerCase())) ||
                (e.teacherName && e.teacherName.toLowerCase().includes(currentSearch.toLowerCase()));

            const matchesSubject = currentSubject === 'ALL' || e.subject === currentSubject;
            const matchesClass = currentClass === 'ALL' || e.className === currentClass;

            return matchesSearch && matchesSubject && matchesClass;
        });

            countEl.textContent = `${filtered.length} Ujian Aktif`;

window.handleStartExam = async function(event) {
    event.preventDefault();
    const btn = document.getElementById('startBtn');
    
    const name = document.getElementById('participantName').value.trim();
    const className = document.getElementById('classNameInput').value.trim();
    const nis = document.getElementById('nis').value.trim() || '-';

    btn.disabled = true;
    btn.innerHTML = '<i class="ph ph-spinner ph-spin"></i> Menyiapkan lembar ujian...';
    
    try {
        const examId = AppState.currentExam.examId;
        const res = await api.startExamAttempt(examId, { name, className, nis });
        
        if (res.success && res.data) {
            AppState.update({ 
                attempt: res.data,
                questions: res.data.questions,
                answers: {}
            });
            UI.showToast('Ujian dimulai. Selamat mengerjakan!', 'success');
            Router.navigate('/student/exam');
        } else {
            const errStr = res.message || 'Gagal memulai ujian.';
            UI.showToast(errStr, 'error');
            btn.disabled = false;
            btn.innerHTML = 'Mulai Ujian Sekarang';
        }
    } catch (e) {
        UI.showToast('Terjadi kesalahan koneksi. Silakan coba lagi.', 'error');
        btn.disabled = false;
        btn.innerHTML = 'Mulai Ujian Sekarang';
    }
};

Router.addRoute('/student/exam', async () => {
    if (AppState.mode !== 'student' || !AppState.attempt) {
        setTimeout(() => Router.navigate('/student/landing'), 0);
        return `<div class="loading-full">Mengalihkan...</div>`;
    }

    const exam = AppState.currentExam;
    const questions = AppState.questions || [];
    let currentIndex = 0; // Local state for pagination

    // Restore locally saved answers from localStorage if available
    const attemptId = AppState.attempt ? AppState.attempt.attemptId : null;
    if (attemptId) {
        try {
            const cachedAnswers = localStorage.getItem('cbt_ans_' + attemptId);
            if (cachedAnswers) {
                const parsed = JSON.parse(cachedAnswers);
                if (parsed && typeof parsed === 'object') {
                    AppState.answers = Object.assign({}, parsed, AppState.answers || {});
                }
            }
        } catch (e) {
            console.warn("Failed to load local cached answers:", e);
        }
    }

    // Helper to render question
    window.renderQuestion = function(index) {
        currentIndex = index;
        const q = questions[index];
        const answers = AppState.answers[q.id] || [];
        
        let optionsHtml = '';
        if (q.type === 'MCQ') {
            optionsHtml = q.options.map(opt => {
                const isSel = answers === opt.id;
                return `
                    <label class="option-card ${isSel ? 'selected' : ''}">
                        <input type="radio" name="q_${q.id}" value="${opt.id}" ${isSel ? 'checked' : ''} onchange="handleAnswer('${q.id}', '${opt.id}', '${q.type}')">
                        <span class="opt-badge">${opt.id}</span>
                        <div class="opt-content">
                            <span>${escapeHtml(opt.text)}</span>
                            ${opt.imageUrl ? `<img src="${formatDirectImageUrl(opt.imageUrl)}" alt="Gambar Opsi" referrerpolicy="no-referrer" onerror="handleImgError(this)" style="max-height: 80px; max-width: 120px; object-fit: contain; border-radius: 4px; border: 1px solid var(--border-color); background: #ffffff;">` : ''}
                        </div>
                    </label>
                `;
            }).join('');
        } else if (q.type === 'TRUE_FALSE') {
            const tfLabels = getTfLabels(q.tfType);
            let statements = q.options || [];
            // Backward compatibility fallback for old single TRUE_FALSE
            if (statements.length === 2 && (statements[0].id === 'TRUE' || statements[0].text === 'Benar' || statements[0].text === 'Sesuai' || statements[0].text === 'Tepat')) {
                statements = [{ id: '1', text: q.text }];
            }
            const currentAns = (answers && typeof answers === 'object' && !Array.isArray(answers)) ? answers : {};

            optionsHtml = `
                <div class="table-responsive" style="overflow-x: auto; width: 100%; border-radius: var(--radius-md); border: 1px solid var(--border-color); background: #ffffff; margin-bottom: 1rem; box-shadow: var(--shadow-sm);">
                    <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.95rem;">
                        <thead>
                            <tr style="background: #e0f2fe; color: #0369a1; border-bottom: 2px solid #bae6fd;">
                                <th style="padding: 12px 16px; font-weight: 700; width: 66%;">Pernyataan</th>
                                <th style="padding: 12px 14px; text-align: center; width: 17%; font-weight: 700;">${tfLabels.positive}</th>
                                <th style="padding: 12px 14px; text-align: center; width: 17%; font-weight: 700;">${tfLabels.negative}</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${statements.map((opt, sIdx) => {
                                const val = currentAns[opt.id] || '';
                                const isPos = (val === 'TRUE' || val === 'BENAR' || val === 'B' || val === 'SESUAI' || val === 'TEPAT' || val === '1');
                                const isNeg = (val === 'FALSE' || val === 'SALAH' || val === 'S' || val === 'TS' || val === 'TT' || val === 'TIDAK SESUAI' || val === 'TIDAK TEPAT' || val === '0');
                                return `
                                    <tr style="border-bottom: 1px solid var(--border-color); background: ${sIdx % 2 === 0 ? '#ffffff' : 'var(--bg-base)'};">
                                        <td style="padding: 12px 16px; vertical-align: middle; line-height: 1.5; color: var(--text-primary); font-weight: 500;">
                                            ${escapeHtml(opt.text)}
                                        </td>
                                        <td style="padding: 12px 14px; text-align: center; vertical-align: middle;">
                                            <label style="display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; cursor: pointer; margin: 0;" title="${tfLabels.positive}">
                                                <input type="radio" name="tf_${q.id}_${opt.id}" value="TRUE" ${isPos ? 'checked' : ''} 
                                                       onchange="handleTrueFalseAnswer('${q.id}', '${opt.id}', 'TRUE')" 
                                                       style="width: 1.35rem; height: 1.35rem; cursor: pointer; accent-color: var(--primary-600);">
                                            </label>
                                        </td>
                                        <td style="padding: 12px 14px; text-align: center; vertical-align: middle;">
                                            <label style="display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; cursor: pointer; margin: 0;" title="${tfLabels.negative}">
                                                <input type="radio" name="tf_${q.id}_${opt.id}" value="FALSE" ${isNeg ? 'checked' : ''} 
                                                       onchange="handleTrueFalseAnswer('${q.id}', '${opt.id}', 'FALSE')" 
                                                       style="width: 1.35rem; height: 1.35rem; cursor: pointer; accent-color: var(--primary-600);">
                                            </label>
                                        </td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        } else if (q.type === 'MCQ_COMPLEX') {
            const answerArr = Array.isArray(answers) ? answers : [];
            optionsHtml = q.options.map(opt => {
                const isSel = answerArr.includes(opt.id);
                return `
                    <label class="option-card ${isSel ? 'selected' : ''}">
                        <input type="checkbox" name="q_${q.id}" value="${opt.id}" ${isSel ? 'checked' : ''} onchange="handleAnswer('${q.id}', '${opt.id}', '${q.type}', event.target.checked)">
                        <span class="opt-badge">${opt.id}</span>
                        <div class="opt-content">
                            <span>${escapeHtml(opt.text)}</span>
                            ${opt.imageUrl ? `<img src="${formatDirectImageUrl(opt.imageUrl)}" alt="Gambar Opsi" referrerpolicy="no-referrer" onerror="handleImgError(this)" style="max-height: 80px; max-width: 120px; object-fit: contain; border-radius: 4px; border: 1px solid var(--border-color); background: #ffffff;">` : ''}
                        </div>
                    </label>
                `;
            }).join('');
        }

        const navHtml = `
            <div class="flex justify-between items-center mt-6 pt-4" style="border-top: 1px solid var(--border-color); gap: 0.5rem; width: 100%;">
                <button class="btn btn-secondary justify-center" style="flex: 1; max-width: 150px;" onclick="renderQuestion(${index - 1})" ${index === 0 ? 'disabled' : ''}>
                    <i class="ph ph-caret-left"></i> Sebelumnya
                </button>
                ${index === questions.length - 1 
                    ? `<button class="btn btn-primary justify-center" style="flex: 1; max-width: 200px;" onclick="submitExam()">Kumpulkan <i class="ph ph-check"></i></button>`
                    : `<button class="btn btn-primary justify-center" style="flex: 1; max-width: 160px;" onclick="renderQuestion(${index + 1})">Selanjutnya <i class="ph ph-caret-right"></i></button>`
                }
            </div>
        `;

        const typeBadge = q.type === 'MCQ' ? 'Pilihan Ganda' : (q.type === 'TRUE_FALSE' ? getTfLabels(q.tfType).name : 'Ganda Kompleks');
        const qImg = q.imageUrl || q.questionImageUrl || '';
        const formattedQImg = formatDirectImageUrl(qImg);

        document.getElementById('questionContainer').innerHTML = `
            <div class="flex justify-between items-center mb-3 pb-2" style="border-bottom: 1px solid var(--border-color); gap: 0.5rem;">
                <div class="flex items-center gap-2">
                    <span class="badge badge-active font-semibold">Soal ${index + 1} dari ${questions.length}</span>
                    <span class="badge text-xs" style="background: var(--bg-base);">${typeBadge}</span>
                </div>
                <span class="text-xs text-muted font-bold">${q.score || 10} Poin</span>
            </div>
            <div class="text-base sm:text-lg font-medium mb-4" style="line-height: 1.6; word-break: break-word; overflow-wrap: anywhere; color: var(--text-primary);">
                ${escapeHtml(q.text)}
            </div>
            ${formattedQImg ? `
                <div class="mb-5 text-center" style="width: 100%; overflow: hidden;">
                    <img src="${formattedQImg}" 
                         alt="Gambar Soal" 
                         referrerpolicy="no-referrer" 
                         loading="lazy" 
                         onerror="handleImgError(this)" 
                         style="max-width: 100%; max-height: 320px; object-fit: contain; border-radius: var(--radius-sm); border: 1px solid var(--border-color); display: inline-block; background: #ffffff; margin: 0 auto; box-shadow: var(--shadow-sm);">
                </div>
            ` : ''}
            ${q.bottomText ? `
                <div class="text-base sm:text-lg font-medium mb-4" style="line-height: 1.6; word-break: break-word; overflow-wrap: anywhere; color: var(--text-primary);">
                    ${escapeHtml(q.bottomText)}
                </div>
            ` : ''}
            <div class="options-container mb-2" style="width: 100%;">
                ${optionsHtml}
            </div>
            ${navHtml}
        `;
        
        updateProgress();
    };

    let hasPendingCloudSync = false;
    let isSyncing = false;

    const persistLocalAnswer = () => {
        if (!attemptId) return;
        try {
            localStorage.setItem('cbt_ans_' + attemptId, JSON.stringify(AppState.answers));
        } catch (e) {
            console.warn("localStorage quota exceeded or unavailable:", e);
        }
        hasPendingCloudSync = true;
        const indicator = document.getElementById('autosaveIndicator');
        if (indicator && !isSyncing) {
            indicator.innerHTML = '<i class="ph ph-check text-success"></i> <span class="hidden sm-inline">Tersimpan di perangkat</span><span class="sm-hidden">Tersimpan</span>';
        }
    };

    const triggerCloudSync = async () => {
        if (!hasPendingCloudSync || isSyncing || !attemptId) return;
        isSyncing = true;
        const indicator = document.getElementById('autosaveIndicator');
        if (indicator) {
            indicator.innerHTML = '<i class="ph ph-spinner ph-spin text-warning"></i> <span class="hidden sm-inline">Menyinkronkan...</span>';
        }

        try {
            const res = await api.saveAttemptAnswers(attemptId, AppState.answers);
            if (res && res.success) {
                hasPendingCloudSync = false;
                if (indicator) {
                    indicator.innerHTML = '<i class="ph ph-cloud-check text-success"></i> <span class="hidden sm-inline">Tersinkron</span>';
                }
            } else {
                if (indicator) {
                    indicator.innerHTML = '<i class="ph ph-check text-success"></i> <span class="hidden sm-inline">Tersimpan lokal</span>';
                }
            }
        } catch (e) {
            if (indicator) {
                indicator.innerHTML = '<i class="ph ph-check text-success"></i> <span class="hidden sm-inline">Tersimpan lokal</span>';
            }
        } finally {
            isSyncing = false;
        }
    };

    // Clean up previous sync timer if any and start fresh 45s throttled sync
    if (window._cbtCloudSyncInterval) {
        clearInterval(window._cbtCloudSyncInterval);
        window._cbtCloudSyncInterval = null;
    }
    window._cbtCloudSyncInterval = setInterval(triggerCloudSync, 45000);

    window.handleAnswer = function(questionId, optionId, type, isChecked = true) {
        if (type === 'MCQ') {
            AppState.answers[questionId] = optionId;
        } else if (type === 'MCQ_COMPLEX') {
            let current = AppState.answers[questionId] || [];
            if (!Array.isArray(current)) current = [];
            
            if (isChecked) {
                if (!current.includes(optionId)) current.push(optionId);
            } else {
                current = current.filter(id => id !== optionId);
            }
            AppState.answers[questionId] = current;
        }
        
        persistLocalAnswer();
        renderQuestion(currentIndex);
    };

    window.handleTrueFalseAnswer = function(questionId, statementId, value) {
        let current = AppState.answers[questionId];
        if (!current || typeof current !== 'object' || Array.isArray(current)) {
            current = {};
        }
        current[statementId] = value;
        AppState.answers[questionId] = current;

        persistLocalAnswer();
        renderQuestion(currentIndex);
    };

    window.updateProgress = function() {
        const gridHtml = questions.map((q, idx) => {
            let hasAnswer = false;
            const ans = AppState.answers[q.id];
            if (q.type === 'TRUE_FALSE') {
                const stmts = (q.options || []);
                if (stmts.length > 0 && ans && typeof ans === 'object' && !Array.isArray(ans)) {
                    hasAnswer = stmts.every(s => ans[s.id] !== undefined && ans[s.id] !== '');
                }
            } else if (q.type === 'MCQ_COMPLEX') {
                hasAnswer = Array.isArray(ans) && ans.length > 0;
            } else {
                hasAnswer = Boolean(ans);
            }
            const isCurrent = idx === currentIndex;
            
            let bg = hasAnswer ? 'var(--primary-500)' : 'var(--bg-base)';
            let color = hasAnswer ? 'white' : 'var(--text-secondary)';
            let border = isCurrent ? '2px solid var(--primary-600)' : '1px solid var(--border-color)';
            
            if(isCurrent && !hasAnswer) {
                bg = 'var(--primary-100)';
            }

            return `<button onclick="renderQuestion(${idx})" style="width: 2.5rem; height: 2.5rem; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-md); background: ${bg}; color: ${color}; border: ${border}; font-size: 0.875rem; font-weight: 500; cursor: pointer; transition: all 0.2s;">${idx + 1}</button>`;
        }).join('');
        document.getElementById('progressGrid').innerHTML = gridHtml;
    };

    window.submitExam = function() {
        UI.showModal(`
            <div class="text-center">
                <i class="ph ph-warning-circle text-warning mb-2" style="font-size: 3rem;"></i>
                <h3 class="mb-2">Kumpulkan Ujian?</h3>
                <p class="text-muted text-sm mb-6">Pastikan semua soal telah dijawab. Jawaban yang telah dikirim tidak dapat diubah kembali.</p>
                <div class="flex justify-center gap-4">
                    <button class="btn btn-secondary" onclick="closeModal()">Batal</button>
                    <button class="btn btn-primary" onclick="executeSubmit()">Ya, Kumpulkan</button>
                </div>
            </div>
        `);
    };

    window.executeSubmit = async function() {
        closeModal();
        if (AppState.timer) clearInterval(AppState.timer);
        if (window._cbtCloudSyncInterval) {
            clearInterval(window._cbtCloudSyncInterval);
            window._cbtCloudSyncInterval = null;
        }

        document.getElementById('app').innerHTML = '<div class="loading-full"><i class="ph ph-spinner ph-spin"></i><span>Memproses dan menilai jawaban Anda...</span></div>';
        
        try {
            const res = await api.submitExamAttempt(AppState.attempt.attemptId, AppState.answers);
            if (res.success && res.data) {
                try {
                    localStorage.removeItem('cbt_ans_' + AppState.attempt.attemptId);
                } catch (e) {}
                AppState.update({ 
                    attempt: { 
                        ...AppState.attempt, 
                        ...res.data,
                        status: 'SUBMITTED' 
                    } 
                });
                Router.navigate('/student/result');
            } else {
                UI.showToast(res.message || 'Gagal mengirim ujian.', 'error');
                Router.handleRoute(); // restore
            }
        } catch (e) {
            UI.showToast('Terjadi kesalahan koneksi server.', 'error');
            Router.handleRoute();
        }
    };

    // Timer Logic
    const updateTimer = () => {
        const now = Date.now();
        const diff = AppState.attempt.deadlineAt - now;
        
        if (diff <= 0) {
            clearInterval(AppState.timer);
            executeSubmit();
            return;
        }

        const m = Math.floor(diff / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        const timerEl = document.getElementById('examTimer');
        if (timerEl) {
            timerEl.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            if (m < 5) timerEl.style.color = 'var(--error)';
        }
    };
    
    if (AppState.timer) clearInterval(AppState.timer);
    AppState.timer = setInterval(updateTimer, 1000);

    // Initial Render Hook
    document.addEventListener('viewRendered', function onRender(e) {
        if (e.detail.path === '/student/exam') {
            renderQuestion(0);
            updateTimer();
            document.removeEventListener('viewRendered', onRender);
        }
    });

    return `
        <div class="view" style="background-color: var(--bg-base); min-height: 100vh; overflow-x: hidden; max-width: 100vw; width: 100%; box-sizing: border-box;">
            <!-- Sticky Header -->
            <div class="glass" style="position: sticky; top: 0; z-index: 100; padding: 0.75rem 0; width: 100%; box-sizing: border-box;">
                <div class="container flex justify-between items-center" style="gap: 0.5rem;">
                    <div style="min-width: 0; flex: 1;">
                        <div class="font-bold text-primary" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.95rem;">${escapeHtml(exam.title)}</div>
                        <div class="text-xs text-muted" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${escapeHtml(AppState.attempt.participantName)} - ${escapeHtml(AppState.attempt.className)}</div>
                    </div>
                    <div class="flex items-center gap-2" style="flex-shrink: 0;">
                        <div id="autosaveIndicator" class="text-xs font-medium flex items-center gap-1" style="color: var(--text-secondary); white-space: nowrap;">
                            <i class="ph ph-check text-success"></i> <span class="hidden sm-inline">Tersimpan di perangkat</span><span class="sm-hidden">Tersimpan</span>
                        </div>
                        <div class="card flex items-center gap-1.5" style="padding: 0.35rem 0.65rem; border-color: var(--primary-200); background: var(--primary-50);">
                            <i class="ph ph-timer text-primary"></i>
                            <span id="examTimer" class="font-bold" style="font-size: 1.05rem; font-family: monospace;">--:--</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="container mt-4" style="box-sizing: border-box; width: 100%; max-width: 100%;">
                <style>
                    .exam-layout { display: grid; grid-template-columns: 1fr 300px; gap: 1.5rem; align-items: start; width: 100%; max-width: 100%; box-sizing: border-box; }
                    @media (min-width: 769px) {
                        .sm-hidden { display: none !important; }
                    }
                    @media (max-width: 768px) {
                        .exam-layout { display: flex; flex-direction: column; gap: 1rem; width: 100%; max-width: 100%; box-sizing: border-box; }
                        #questionContainer { order: 1; width: 100% !important; max-width: 100% !important; box-sizing: border-box !important; }
                        .sidebar-nav { order: 2; position: relative !important; top: 0 !important; width: 100% !important; max-width: 100% !important; box-sizing: border-box !important; }
                        .hidden.sm-flex { display: none !important; }
                        .hidden.sm-inline { display: none !important; }
                    }
                </style>
                <div class="exam-layout">
                    <!-- Question Area (First on mobile) -->
                    <div class="card" id="questionContainer" style="min-height: 380px; width: 100%; max-width: 100%; box-sizing: border-box; overflow-x: hidden;">
                        <!-- Injected by renderQuestion -->
                    </div>

                    <!-- Sidebar Progress (Below question on mobile) -->
                    <div class="card sidebar-nav" style="position: sticky; top: 80px;">
                        <h4 class="mb-4 text-sm font-semibold text-secondary">Navigasi Soal</h4>
                        <div id="progressGrid" style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
                            <!-- Injected by updateProgress -->
                        </div>
                        <hr style="border:0; border-top: 1px solid var(--border-color); margin: 1.5rem 0;">
                        <button class="btn btn-outline-primary w-full" onclick="submitExam()">Selesai Ujian</button>
                    </div>
                </div>
            </div>
        </div>
    `;
});

                    <div style="font-size: 1.6rem; margin-bottom: 0.25rem;">🎉 🏆 🌟</div>
                    <div style="font-weight: 800; color: #15803d; font-size: 0.96rem; letter-spacing: -0.01em;">Luar Biasa, Kamu Berhasil Lulus!</div>
                    <p style="font-size: 0.82rem; color: #166534; margin: 0.35rem 0 0 0; line-height: 1.45;">
                        Kerja keras dan ketekunanmu terbayar dengan hasil yang sangat membanggakan. Pertahankan prestasimu dan teruslah melangkah menjadi lebih hebat! 🚀
                    </p>
                </div>
            ` : `
                <div class="encouragement-card" style="background: #fffbeb; border: 1px solid #fde68a; border-radius: var(--radius-md); padding: 1rem 1.15rem; text-align: center; margin-top: 0.75rem;">
                    <div style="font-size: 1.6rem; margin-bottom: 0.25rem;">💪 📖 ✨</div>
                    <div style="font-weight: 800; color: #b45309; font-size: 0.96rem; letter-spacing: -0.01em;">Tetap Semangat & Jangan Menyerah!</div>
                    <p style="font-size: 0.82rem; color: #92400e; margin: 0.35rem 0 0 0; line-height: 1.45;">
                        Setiap proses belajar memiliki tantangan tersendiri. Jadikan hasil ini bahan evaluasi untuk belajar lebih giat lagi, kamu pasti bisa meraih hasil terbaik di kesempatan berikutnya! 🔥
                    </p>
                </div>
            `}
        `;
    } else {

                <div style="font-size: 3.5rem; margin-bottom: 0.5rem;">📬 ✨</div>
                <h3 class="mb-2" style="font-size: 1.25rem; font-weight: 800;">Ujian Berhasil Dikumpulkan!</h3>
                <p class="text-muted text-sm" style="line-height: 1.5;">Seluruh lembar jawaban Anda telah tersimpan aman di server database sekolah.</p>
                <div class="mt-4 p-3" style="background: var(--bg-base); border-radius: var(--radius-md); font-size: 0.82rem; color: var(--text-secondary); line-height: 1.45;">

    return `
        <div class="view flex items-center justify-center" style="background-color: var(--primary-50); min-height: 100vh; padding: 1.5rem 1rem;">
            <div class="card text-center" style="width: 100%; max-width: 460px; box-shadow: var(--shadow-md);">
                <div class="mb-3 text-xs font-semibold text-primary" style="text-transform: uppercase; letter-spacing: 0.05em;">
                    ${escapeHtml(exam.title || 'Ujian Online')}
                </div>
                
                <hr style="border:0; border-top: 1px solid var(--border-color); margin: 0.75rem 0 1rem 0;">

window.handleExitExam = function() {
    const pName = AppState.attempt ? AppState.attempt.participantName : '';
    const eTitle = AppState.currentExam ? AppState.currentExam.title : '';
    const isPassed = AppState.attempt && AppState.currentExam ? (AppState.attempt.score >= AppState.currentExam.kkm) : false;
    
    if (AppState.timer) {
        clearInterval(AppState.timer);
        AppState.timer = null;
    }
    
    AppState.update({ 
        attempt: null, 
        questions: null, 
        answers: {},
        completedSession: {
            name: pName,
            title: eTitle,
            isPassed: isPassed
        }
    });

    Router.navigate('/student/completed');
};

    return `

// --- app.js ---
// ============================================================================
// Application Bootstrapper & Lifecycle Initialization
// ============================================================================
(function() {
    let appInitialized = false;

    function startApp() {
        if (appInitialized) return;
        appInitialized = true;

        try {
            console.log("Web App Ujian Online: Menginisialisasi Router...");
            Router.init();
        } catch (err) {
            console.error("Fatal Error initializing application:", err);
            const app = document.getElementById('app');
            if (app) {
                app.innerHTML = `
                    <div class="container mt-6">
                        <div class="card text-center" style="max-width: 480px; margin: 3rem auto; padding: 2rem;">
                            <div class="text-error mb-3">
                                <i class="ph ph-warning-circle" style="font-size: 3rem;"></i>
                            </div>
                            <h3 style="margin-bottom: 0.5rem;">Gagal Memuat Aplikasi</h3>
                            <p class="text-muted text-sm mb-4">
                                ${err && err.message ? err.message : 'Terjadi kesalahan sistem saat inisialisasi aplikasi.'}
                            </p>
                            <button class="btn btn-primary" onclick="window.location.reload()">
                                Muat Ulang Halaman
                            </button>
                        </div>
                    </div>
                `;
            }
        }
    }

    // Support both direct load and sandboxed iframe environments (Google Apps Script)
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
        setTimeout(startApp, 10);
    } else {
        document.addEventListener('DOMContentLoaded', startApp);
        window.addEventListener('load', startApp);
        // Fallback timer if events were already dispatched
        setTimeout(startApp, 300);
    }

    // Safety Watchdog: If #app is still displaying the static "Memuat Aplikasi..." after 1500ms, force recovery
    setTimeout(() => {
        const app = document.getElementById('app');
        if (app && app.innerHTML.includes('Memuat Aplikasi...')) {
            console.warn("Safety Watchdog: Initial loading screen stuck. Forcing route resolution to /login...");
            try {
                if (typeof Router !== 'undefined') {
                    if (!window.location.hash || window.location.hash === '#' || window.location.hash === '#/') {
                        window.location.hash = '#/login';
                    }
                    if (typeof Router.handleRoute === 'function') {
                        Router.handleRoute();
                    }
                }
            } catch (recoveryErr) {
                console.error("Watchdog recovery failed:", recoveryErr);
            }
        }
    }, 1500);
})();



    </script>
