<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web App Ujian Online</title>
    <meta name="color-scheme" content="light">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/css/icons.css">
    <script src="https://unpkg.com/@phosphor-icons/web" defer></script>
    <!-- SheetJS (Excel .xlsx parser & exporter) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
/* --- styles.css --- */
:root {
    /* Indigo Palette */
    --primary-50: #eef2ff;
    --primary-100: #e0e7ff;
    --primary-200: #c7d2fe;
    --primary-300: #a5b4fc;
    --primary-400: #818cf8;
    --primary-500: #6366f1; /* Brand */
    --primary-600: #4f46e5;
    --primary-700: #4338ca;
    
    /* Neutrals - Light Mode */
    --bg-base: #f8fafc;
    --bg-surface: #ffffff;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
    --border-color: #e2e8f0;
    
    /* Status Colors */
    --success: #10b981;
    --error: #ef4444;
    --warning: #f59e0b;
    --info: #3b82f6;

    /* Shadow & Radius */
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    
    --radius-md: 0.5rem;
    --radius-lg: 0.75rem;
    --radius-xl: 1rem;
    --radius-full: 9999px;
    
    --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

/* Strict Light Mode - Dark Mode is completely disabled */
:root, html, body {
    color-scheme: light !important;
}

html, body {
    overflow-x: hidden;
    max-width: 100%;
    width: 100%;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: var(--font-sans);
    background-color: var(--bg-base);
    color: var(--text-primary);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
}

/* Teacher Profile Chip in Navbar */
.teacher-profile-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.25rem 0.6rem;
    border-radius: var(--radius-full);
    background: var(--bg-base);
    border: 1px solid var(--border-color);
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text-primary);
    max-width: 160px;
}
.teacher-profile-chip .teacher-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* Typography */
h1, h2, h3, h4 {
    font-weight: 600;
    line-height: 1.2;
    margin-bottom: 0.5rem;
}

h1 { font-size: 2rem; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.25rem; }

/* Layout Utilities */
.container {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 1rem;
    box-sizing: border-box;
}
.container-sm {
    max-width: 600px;
}

.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.justify-center { justify-content: center; }
.gap-2 { gap: 0.5rem; }
.gap-3 { gap: 0.75rem; }
.gap-4 { gap: 1rem; }
.gap-6 { gap: 1.5rem; }

.grid { display: grid; }
.grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

@media (max-width: 768px) {
    .grid-cols-3, .grid-cols-4 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 640px) {
    .grid-cols-2, .grid-cols-3, .grid-cols-4 {
        grid-template-columns: 1fr;
    }
    .container {
        padding: 0 0.75rem;
    }
    .card {
        padding: 1rem;
    }
    /* Mobile column span reset to prevent horizontal blowout */
    [style*="grid-column: span"], [style*="grid-column:span"] {
        grid-column: 1 / -1 !important;
    }
}

/* Cards & Surfaces */
.card {
    background-color: var(--bg-surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-color);
    padding: 1.5rem;
    transition: box-shadow 0.2s ease, transform 0.2s ease;
}

/* Buttons */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.625rem 1.25rem;
    font-size: 0.875rem;
    font-weight: 500;
    border-radius: var(--radius-md);
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
}

.btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.btn-sm {
    padding: 0.375rem 0.75rem;
    font-size: 0.8125rem;
}

.btn-lg {
    padding: 0.75rem 1.5rem;
    font-size: 1rem;
}

.btn-primary {
    background-color: var(--primary-600);
    color: white;
}
.btn-primary:hover:not(:disabled) {
    background-color: var(--primary-700);
}

.btn-secondary {
    background-color: transparent;
    border-color: var(--border-color);
    color: var(--text-primary);
}
.btn-secondary:hover:not(:disabled) {
    background-color: var(--bg-base);
}

.btn-outline-primary {
    background-color: transparent;
    border-color: var(--primary-500);
    color: var(--primary-600);
}
.btn-outline-primary:hover:not(:disabled) {
    background-color: var(--primary-50);
}

.btn-danger {
    background-color: transparent;
    border-color: var(--error);
    color: var(--error);
}
.btn-danger:hover:not(:disabled) {
    background-color: var(--error);
    color: white;
}

.btn-icon {
    padding: 0.5rem;
    border-radius: var(--radius-full);
}

/* Inputs */
.input-group {
    display: flex;
    flex-direction: column;
    gap: 0.375rem;
    margin-bottom: 1.25rem;
}

.input-label {
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--text-secondary);
}

.input-control {
    padding: 0.625rem 0.875rem;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-color);
    background-color: var(--bg-surface);
    color: var(--text-primary);
    font-size: 0.875rem;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
    width: 100%;
}

.input-control:focus {
    border-color: var(--primary-500);
    box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
}

/* Toasts */
.toast-container {
    position: fixed;
    bottom: 1rem;
    right: 1rem;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}
.toast {
    background-color: var(--bg-surface);
    color: var(--text-primary);
    padding: 0.875rem 1rem;
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg);
    border-left: 4px solid var(--primary-500);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    min-width: 280px;
    animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
.toast.error { border-left-color: var(--error); }
.toast.success { border-left-color: var(--success); }
.toast.warning { border-left-color: var(--warning); }

@media (max-width: 640px) {
    .toast-container {
        bottom: 1rem;
        left: 0.75rem;
        right: 0.75rem;
        width: auto;
    }
    .toast {
        min-width: unset;
        width: 100%;
    }
}

@keyframes slideInRight {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}
@keyframes fadeOut {
    to { opacity: 0; }
}

/* Modals */
.modal-container {
    position: fixed;
    inset: 0;
    z-index: 5000;
    display: flex;
    align-items: center;
    justify-content: center;
}
.modal-overlay {
    position: absolute;
    inset: 0;
    background-color: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: fadeIn 0.2s ease;
}
.modal-content {
    position: relative;
    background-color: var(--bg-surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border-color);
    width: 90%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 1.5rem;
    z-index: 10;
    animation: scaleUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes scaleUp {
    from { transform: scale(0.95); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

/* Utilities */
.hidden { display: none !important; }
.text-center { text-align: center; }
.text-right { text-align: right; }
.text-sm { font-size: 0.875rem; }
.text-xs { font-size: 0.75rem; }
.text-muted { color: var(--text-muted); }
.text-primary { color: var(--primary-600); }
.font-semibold { font-weight: 600; }
.font-bold { font-weight: 700; }
.mt-2 { margin-top: 0.5rem; }
.mt-4 { margin-top: 1rem; }
.mt-6 { margin-top: 1.5rem; }
.mb-2 { margin-bottom: 0.5rem; }
.mb-4 { margin-bottom: 1rem; }
.mb-6 { margin-bottom: 1.5rem; }
.ml-auto { margin-left: auto; }
.w-full { width: 100%; }

/* Loading Spinner */
.loading-full {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-size: 1.125rem;
    color: var(--text-secondary);
    gap: 1rem;
}
.loading-full i {
    font-size: 3rem;
    color: var(--primary-500);
}

/* View Container */
.view {
    min-height: 100vh;
    padding-bottom: 2rem;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* Navbar */
.navbar {
    background-color: var(--bg-surface);
    border-bottom: 1px solid var(--border-color);
    padding: 1rem 0;
    position: sticky;
    top: 0;
    z-index: 1000;
}
.navbar .container {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.brand {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--primary-600);
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

/* Status Badges */
.badge {
    display: inline-flex;
    align-items: center;
    padding: 0.125rem 0.625rem;
    font-size: 0.75rem;
    font-weight: 600;
    border-radius: var(--radius-full);
}
.badge-draft { background-color: var(--bg-base); color: var(--text-secondary); border: 1px solid var(--border-color); }
.badge-active { background-color: rgba(16, 185, 129, 0.1); color: var(--success); }
.badge-inactive { background-color: rgba(245, 158, 11, 0.1); color: var(--warning); }
.badge-archived { background-color: rgba(239, 68, 68, 0.1); color: var(--error); }

/* Custom Scrollbar */
::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}
::-webkit-scrollbar-track {
    background: var(--bg-base);
}
::-webkit-scrollbar-thumb {
    background: var(--text-muted);
    border-radius: var(--radius-full);
}
::-webkit-scrollbar-thumb:hover {
    background: var(--text-secondary);
}

/* Responsive Enhancements for Mobile */
.table-responsive {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: var(--radius-md);
    margin-bottom: 1rem;
}

.option-builder-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.5rem;
    flex-wrap: wrap;
}

@media (max-width: 768px) {
    .navbar .container {
        flex-wrap: wrap;
        gap: 0.5rem;
    }
    .navbar .brand {
        font-size: 1.125rem;
    }
    .btn {
        padding: 0.5rem 0.875rem;
    }
    .btn-sm {
        padding: 0.35rem 0.65rem;
    }
    h1 { font-size: 1.5rem; }
    h2 { font-size: 1.25rem; }
    h3 { font-size: 1.1rem; }

    /* Student Exam Mobile: Question container on top, navigation below */
    .exam-layout {
        display: flex !important;
        flex-direction: column !important;
        gap: 1rem !important;
    }
    .exam-layout > #questionContainer {
        order: 1 !important;
    }
    .exam-layout > .sidebar-nav {
        order: 2 !important;
        position: relative !important;
        top: 0 !important;
    }

    /* Option Builder Mobile */
    .option-builder-row {
        background: var(--bg-base);
        padding: 0.625rem;
        border-radius: var(--radius-md);
        border: 1px solid var(--border-color);
        margin-bottom: 0.75rem;
    }
    .option-builder-row .opt-text-input {
        width: calc(100% - 2.5rem) !important;
        flex-grow: 1;
    }
    .option-builder-row .opt-extra {
        width: 100%;
        display: flex;
        gap: 0.5rem;
        align-items: center;
        margin-top: 0.25rem;
    }
    .option-builder-row .opt-extra input {
        flex-grow: 1;
        width: auto !important;
    }

    /* Option touch cards in exam */
    .option-card {
        padding: 0.875rem !important;
        min-height: 48px;
    }
    .option-card input[type="radio"],
    .option-card input[type="checkbox"] {
        width: 1.35rem !important;
        height: 1.35rem !important;
    }
}

/* Visibility Toggles */
.desktop-only {
    display: block;
}
.mobile-only {
    display: none;
}
@media (max-width: 768px) {
    .desktop-only {
        display: none !important;
    }
    .mobile-only {
        display: flex !important;
        flex-direction: column;
        gap: 1rem;
    }
}

/* Mobile Exam Card */
.exam-card-mobile {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 1.25rem;
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    gap: 1rem;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.exam-card-mobile:hover {
    box-shadow: var(--shadow-md);
}
.exam-card-mobile .card-header-mobile {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.75rem;
}
.exam-card-mobile .exam-title-mobile {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.35;
}
.exam-card-mobile .meta-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    align-items: center;
}
.exam-card-mobile .meta-tag {
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text-secondary);
    background: var(--bg-base);
    padding: 0.25rem 0.6rem;
    border-radius: var(--radius-sm);
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    border: 1px solid var(--border-color);
}
.exam-card-mobile .action-group-primary {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
}
.exam-card-mobile .action-group-secondary {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0.5rem;
}
.exam-card-mobile .btn {
    justify-content: center;
    font-size: 0.85rem;
    padding: 0.6rem 0.5rem;
}

/* ============================================================================
   MODAL SYSTEM
   ============================================================================ */
.modal-container {
    position: fixed;
    inset: 0;
    z-index: 1050;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    overflow-y: auto;
}
.modal-container.hidden {
    display: none !important;
}
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.65);
    backdrop-filter: blur(4px);
    z-index: 1;
}
.modal-content {
    position: relative;
    z-index: 2;
    background: #ffffff;
    border-radius: var(--radius-lg);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    border: 1px solid var(--border-color);
    max-width: 100%;
    width: auto;
    max-height: 90vh;
    overflow-y: auto !important;
    -webkit-overflow-scrolling: touch;
}

/* ============================================================================
   STUDENT ATTEMPT REVIEW MODAL (TEACHER RESULTS)
   ============================================================================ */
.attempt-detail-modal {
    max-width: 760px;
    width: 100%;
    padding: 1.5rem;
    text-align: left;
    background: #ffffff;
    box-sizing: border-box;
}
.student-summary-box {
    background: var(--bg-base);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 1.25rem;
    margin-bottom: 1.25rem;
    box-sizing: border-box;
}
.student-q-item {
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 1.15rem;
    margin-bottom: 1rem;
    box-sizing: border-box;
    width: 100%;
    overflow: hidden;
}
.student-q-item.correct-item {
    border-left: 4px solid var(--success);
}
.student-q-item.wrong-item {
    border-left: 4px solid var(--error);
}
.ans-box {
    border-radius: var(--radius-sm);
    padding: 0.7rem 0.85rem;
    margin-top: 0.5rem;
    font-size: 0.9rem;
    display: flex;
    align-items: flex-start;
    gap: 0.65rem;
    word-break: break-word;
    overflow-wrap: anywhere;
    box-sizing: border-box;
    width: 100%;
    clear: both;
}
.ans-box-student-correct {
    background: #ecfdf5;
    border: 1px solid #a7f3d0;
    color: #065f46;
}
.ans-box-student-wrong {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
}
.ans-box-key {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    color: #1e40af;
    margin-top: 0.65rem;
}

.ans-box .ans-icon-wrap {
    flex-shrink: 0;
    margin-top: 2px;
}
.ans-box .ans-content-wrap {
    flex: 1;
    min-width: 0;
    word-break: break-word;
    overflow-wrap: anywhere;
}

/* Teacher Profile Chip in Header */
.teacher-profile-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--primary-700);
    background: var(--primary-50);
    padding: 0.25rem 0.65rem;
    border-radius: var(--radius-full);
    border: 1px solid var(--primary-200);
    max-width: 170px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    vertical-align: middle;
}
.teacher-profile-chip i {
    font-size: 1.05rem;
    color: var(--primary-600);
    flex-shrink: 0;
}
@media (max-width: 640px) {
    .teacher-profile-chip {
        max-width: 120px;
        font-size: 0.75rem;
        padding: 0.2rem 0.45rem;
        gap: 0.25rem;
    }
    .teacher-profile-chip i {
        font-size: 0.9rem;
    }
}

@media (max-width: 768px) {
    .modal-container {
        padding: 0 !important;
        align-items: flex-end !important;
    }
    .modal-content {
        border-radius: var(--radius-xl) var(--radius-xl) 0 0 !important;
        max-height: 92vh !important;
        width: 100% !important;
        max-width: 100% !important;
        padding: 1.25rem 1rem 3.5rem 1rem !important;
        overflow-y: auto !important;
        -webkit-overflow-scrolling: touch !important;
        overscroll-behavior: contain;
    }
    .attempt-detail-modal,
    .import-modal-content {
        padding: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        box-sizing: border-box;
    }
    .student-summary-box {
        padding: 0.85rem;
    }
    .student-summary-box .stats-grid {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 0.5rem !important;
    }
    .student-q-item {
        padding: 0.85rem;
    }
}

/* ============================================================================
   STUDENT EXAM - OPTION CARDS (RESPONSIVE & ANTI-CUTOFF)
   ============================================================================ */
.option-card {
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    padding: 0.85rem 1rem;
    border: 1.5px solid var(--border-color);
    border-radius: var(--radius-md);
    margin-bottom: 0.65rem;
    cursor: pointer;
    background: #ffffff;
    transition: all 0.18s ease;
    user-select: none;
    min-height: 52px;
}
.option-card:hover {
    border-color: var(--primary-300);
    background: #f8fafc;
}
.option-card.selected {
    border-color: var(--primary-600) !important;
    background: var(--primary-50) !important;
}
.option-card input[type="radio"],
.option-card input[type="checkbox"] {
    width: 1.25rem;
    height: 1.25rem;
    accent-color: var(--primary-600);
    flex-shrink: 0;
    margin-top: 0.2rem;
    cursor: pointer;
}

// Global State Management
const AppState = {
    mode: null, // 'teacher' | 'student'
    user: null, // { teacherId, teacherName, role }
    currentExam: null, // exam object
    questions: [], // array of questions for current exam
    attempt: null, // current attempt data
    answers: {}, // local autosave answers mapping
    timer: null, // interval reference
    
    // Subscriptions for reactivity (simple observer pattern)
    listeners: [],
    
    subscribe(listener) {
        this.listeners.push(listener);
    },
    
    notify() {
        this.listeners.forEach(listener => listener(this));
    },
    
    update(updates) {
        Object.assign(this, updates);
        this.notify();
    }
};

// Global UI Utilities (Toasts, Modals)
const UI = {
    showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        if (!container) return;
        
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        
        let icon = 'ph-info';
        if (type === 'success') icon = 'ph-check-circle';
        if (type === 'error') icon = 'ph-warning-circle';
        if (type === 'warning') icon = 'ph-warning';
        
        toast.innerHTML = `
            <div class="flex items-center gap-3">
                <i class="ph ${icon} ph-xl"></i>
                <span class="text-sm font-medium">${message}</span>
            </div>
        `;
        
        container.appendChild(toast);
        
        setTimeout(() => {
            toast.style.animation = 'fadeOut 0.3s ease forwards';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    },
    
    showModal(htmlContent) {
        const container = document.getElementById('modal-container');
        const body = document.getElementById('modal-body');
        if (!container || !body) return;
        
        body.innerHTML = htmlContent;
        container.classList.remove('hidden');
    },
    
    closeModal() {
        const container = document.getElementById('modal-container');
        if (container) {
            container.classList.add('hidden');
        }
    }
};

// Global helper to safely escape HTML special characters
function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}
window.escapeHtml = escapeHtml;

// Global helper to convert Google Drive and general image links into direct loadable URLs
function formatDirectImageUrl(url) {
    if (!url || typeof url !== 'string') return '';
    url = url.trim();
    if (!url) return '';
    
    // Base64 images are directly valid in <img src="...">
    if (url.startsWith('data:image/')) return url;

    // Check if Google Drive link (various sharing formats)
    let driveId = null;
    const m1 = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
    if (m1 && m1[1]) {
        driveId = m1[1];
    } else {
        const m2 = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
        if (m2 && m2[1]) {
            driveId = m2[1];
        } else {
            const m3 = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (m3 && m3[1]) {
                driveId = m3[1];
            }
        }
    }

    if (driveId) {
        // Direct Google CDN link that works in <img> without cookie restrictions
        return 'https://lh3.googleusercontent.com/d/' + driveId;
    }

    // Dropbox raw image conversion
    if (url.includes('dropbox.com') && url.includes('dl=0')) {
        return url.replace('dl=0', 'raw=1');
    }

    return url;
}
window.formatDirectImageUrl = formatDirectImageUrl;

// Fallback image error handler
window.handleImgError = function(imgEl) {
    if (!imgEl) return;
    const currentSrc = imgEl.src || '';
    if (currentSrc.includes('lh3.googleusercontent.com/d/')) {
        imgEl.src = currentSrc.replace('https://lh3.googleusercontent.com/d/', 'https://drive.google.com/thumbnail?sz=w1000&id=');
    } else if (currentSrc.includes('drive.google.com/thumbnail')) {
        imgEl.src = currentSrc.replace('https://drive.google.com/thumbnail?sz=w1000&id=', 'https://drive.google.com/uc?export=view&id=');
    } else {
        imgEl.style.display = 'none';
    }
};

const isGAS = typeof google !== 'undefined' && Boolean(google.script && google.script.run);

function _callGAS(functionName, ...args) {
    return new Promise((resolve) => {
        try {
            google.script.run
                .withSuccessHandler((res) => {
                    resolve(res || { success: true, data: null, message: "" });
                })
                .withFailureHandler((err) => {
                    console.error(`Apps Script Error in ${functionName}:`, err);
                    resolve({ 
                        success: false, 
                        data: null, 
                        message: err.message || "Terjadi kesalahan server Google Apps Script." 
                    });
                })[functionName](...args);
        } catch (e) {
            console.error(`Call failed for ${functionName}:`, e);
            resolve({ success: false, data: null, message: e.message });
        }
    });
}

// Simple Hash-based Router
const Router = {
    routes: {},
    currentRoute: null,
    
    addRoute(path, handler) {
        this.routes[path] = handler;
    },
    
    navigate(path) {
        const targetHash = path.startsWith('#') ? path : '#' + path;
        if (window.location.hash === targetHash) {
            this.handleRoute();
        } else {
            window.location.hash = targetHash;
        }
    },
    
    async handleRoute() {
        let hash = window.location.hash || '#/login';
        if (hash === '#' || hash === '#/') hash = '#/login';

        // Extract path and query params (e.g. #/exam?id=123)
        const rawPath = hash.startsWith('#') ? hash.substring(1) : hash;
        const [path, queryString] = rawPath.split('?');
        const params = new URLSearchParams(queryString || '');
        
        const app = document.getElementById('app');
        if (!app) return;
        
        if (this.routes[path]) {
            this.currentRoute = path;
            // Clear current view
            app.innerHTML = '<div class="loading-full"><i class="ph ph-spinner ph-spin"></i><span>Memuat...</span></div>';
            
            try {
                // Execute route handler
                const viewHtml = await this.routes[path](params);
                app.innerHTML = viewHtml;
                
                // Trigger an event so views can attach event listeners after DOM update
                document.dispatchEvent(new CustomEvent('viewRendered', { detail: { path, params } }));
            } catch (error) {
                console.error("Route error:", error);
                app.innerHTML = `<div class="container mt-6"><div class="card"><h2 class="text-error">Error</h2><p>Gagal memuat halaman: ${error.message || error}</p></div></div>`;
            }
        } else {
            app.innerHTML = `<div class="container mt-6 text-center view">
                <h2>404 Not Found</h2>
                <p class="text-muted mb-4">Halaman yang Anda tuju tidak ditemukan.</p>
                <button class="btn btn-primary" onclick="Router.navigate('/login')">Kembali ke Awal</button>
            </div>`;
        }
    },
    
    init() {
        window.addEventListener('hashchange', () => this.handleRoute());
        
        const resolveInitialRoute = (params = {}) => {
            // Priority 1: Check existing hash
            if (window.location.hash && window.location.hash !== '#' && window.location.hash !== '#/') {
                this.handleRoute();
                return;
            }
            
            // Priority 2: Check query parameters (injected, GAS client, or URL search)
            const injected = (typeof window !== 'undefined' && window.__INITIAL_PARAMS__) || {};
            const urlParams = new URLSearchParams(window.location.search);
            const examId = params.exam || params.examId || injected.exam || injected.examId || urlParams.get('exam') || urlParams.get('examId');
            const mode = params.mode || injected.mode || urlParams.get('mode');
            const page = params.page || injected.page || urlParams.get('page');
            const role = params.role || injected.role || urlParams.get('role');
            const portal = params.portal || injected.portal || urlParams.get('portal');
            const view = params.view || injected.view || urlParams.get('view');
            
            if (examId) {
                window.location.hash = `#/student/landing?examId=${encodeURIComponent(examId)}`;
            } else if (page === 'student' || page === 'siswa' || page === 'portal' ||
                       mode === 'student' || mode === 'siswa' ||
                       role === 'student' || role === 'siswa' ||
                       portal === 'student' || portal === 'siswa' ||
                       view === 'student' || view === 'siswa') {
                window.location.hash = `#/student/dashboard`;
            } else if (mode === 'teacher') {
                window.location.hash = `#/dashboard`;
            } else {
                window.location.hash = `#/login`;
            }
            
            this.handleRoute();
        };

        // If window.__INITIAL_PARAMS__ already has routing flags, resolve immediately!
        const initial = (typeof window !== 'undefined' && window.__INITIAL_PARAMS__) || {};
        if (initial.exam || initial.examId || initial.mode || initial.page || initial.role || initial.portal || initial.view) {
            resolveInitialRoute(initial);
            return;
        }

        // Retrieve URL parameters via Google Apps Script client API if in GAS, or URLSearchParams
        if (typeof google !== 'undefined' && google.script && google.script.url) {
            let resolved = false;
            const timer = setTimeout(() => {
                if (!resolved) {
                    resolved = true;
                    resolveInitialRoute({});
                }
            }, 2500);

            try {
                google.script.url.getLocation((loc) => {
                    if (!resolved) {
                        resolved = true;
                        clearTimeout(timer);
                        if (loc && loc.url) {
                            window.WEB_APP_URL = loc.url.split('?')[0].split('#')[0];
                        }
                        resolveInitialRoute(loc ? (loc.parameter || {}) : {});
                    }
                });
            } catch (err) {
                if (!resolved) {
                    resolved = true;
                    clearTimeout(timer);
                    resolveInitialRoute({});
                }
            }
        } else {
            resolveInitialRoute({});
        }
    }
};

        baseUrl = ['https:', '', 'script.' + 'google.com', 'macros', 's', 'AKfycbwD5Ezfr1xclvOw4Q6h6vIxwSTY9Sjq75424i4ex7LbGcAG5QdP27-9KBJeuqARXdQo1w', 'exec'].join('/');

    const cleanBase = baseUrl.split('?')[0].split('#')[0];

window.handleSaveExam = async function(event) {
    event.preventDefault();
    const btn = document.getElementById('saveExamBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="ph ph-spinner ph-spin"></i> Menyimpan...';

    const params = new URLSearchParams(window.location.hash.split('?')[1] || '');
    const examId = params.get('id');

    const examData = {
        examId: examId || undefined,
        title: document.getElementById('title').value.trim(),
        subject: document.getElementById('subject').value.trim(),
        className: document.getElementById('className').value.trim(),
        material: document.getElementById('material').value.trim(),
        description: document.getElementById('description').value.trim(),
        instructions: document.getElementById('instructions').value.trim(),
        durationMinutes: Number(document.getElementById('durationMinutes').value || 60),
        kkm: Number(document.getElementById('kkm').value || 75),
        maxAttempts: Number(document.getElementById('maxAttempts').value || 1),
        attemptScoring: document.getElementById('attemptScoring').value,
        status: document.getElementById('status').value,
        dateStart: document.getElementById('dateStart').value,
        dateEnd: document.getElementById('dateEnd').value,
        randomizeQuestions: document.getElementById('randomizeQuestions').checked,
        randomizeOptions: document.getElementById('randomizeOptions').checked,
        showResult: document.getElementById('showResult').checked
    };

    try {
        const res = await api.saveExam(AppState.user.sessionId, examData);
        if (res.success) {
            UI.showToast(res.message || 'Ujian berhasil disimpan!', 'success');
            Router.navigate('/dashboard');
        } else {
            UI.showToast(res.message || 'Gagal menyimpan ujian.', 'error');
            btn.disabled = false;
            btn.innerHTML = '<i class="ph ph-floppy-disk"></i> Simpan Ujian';
        }
    } catch (e) {
        UI.showToast('Terjadi kesalahan koneksi server.', 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="ph ph-floppy-disk"></i> Simpan Ujian';
    }
};


// --- question-builder.js ---
Router.addRoute('/question-builder', async (params) => {
    if (!AppState.user || AppState.user.role !== 'TEACHER') {
        setTimeout(() => Router.navigate('/login'), 0);
        return `<div class="loading-full">Mengalihkan...</div>`;
    }

    const examId = params.get('examId');
    if (!examId) {
        setTimeout(() => Router.navigate('/dashboard'), 0);
        return `<div class="loading-full">Error...</div>`;
    }

    let questions = [];
    try {
        const res = await api.getQuestions(AppState.user.sessionId, examId);
        if (res.success && Array.isArray(res.data)) {
            questions = res.data;
        }
    } catch (e) {
        console.error("Error loading questions:", e);
    }

    window.addQuestion = function(type) {
        let newQ = {
            id: 'Q_' + Math.floor(Math.random() * 90000 + 10000),
            type: type,
            text: '',
            bottomText: '',
            imageUrl: '',
            score: 10,
            options: [],
            correctAnswer: null,
            scoringMethod: 'EXACT'
        };
        
        if (type === 'MCQ' || type === 'MCQ_COMPLEX') {
            newQ.options = [
                { id: 'A', text: '', imageUrl: '' },
                { id: 'B', text: '', imageUrl: '' },
                { id: 'C', text: '', imageUrl: '' },
                { id: 'D', text: '', imageUrl: '' }
            ];
            newQ.correctAnswer = type === 'MCQ' ? 'A' : ['A'];
        } else if (type === 'TRUE_FALSE') {
            newQ.options = [
                { id: '1', text: '' },
                { id: '2', text: '' },
                { id: '3', text: '' }
            ];
            newQ.correctAnswer = { '1': 'TRUE', '2': 'TRUE', '3': 'FALSE' };
            newQ.scoringMethod = 'EXACT';
        }
        
        questions.push(newQ);
        renderQuestionsList();

        // Smooth scroll directly to the newly added question card & focus
        setTimeout(() => {
            const cards = document.querySelectorAll('#questionsListContainer .question-card-item');
            if (cards.length > 0) {
                const lastCard = cards[cards.length - 1];
                lastCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                const textarea = lastCard.querySelector('textarea');
                if (textarea) {
                    textarea.focus();
                }
            }
        }, 120);
    };

    window.deleteQuestion = function(id) {
        if (!confirm('Hapus soal ini?')) return;
        questions = questions.filter(q => q.id !== id);
        renderQuestionsList();
    };

    window.addOption = function(qIndex) {
        const q = questions[qIndex];
        if (!q) return;
        const nextLetter = String.fromCharCode(65 + q.options.length);
        q.options.push({ id: nextLetter, text: `Pilihan ${nextLetter}`, imageUrl: '' });
        renderQuestionsList();
    };

    window.removeOption = function(qIndex, optIndex) {
        const q = questions[qIndex];
        if (!q || q.options.length <= 2) {
            UI.showToast('Minimal harus ada 2 opsi pilihan.', 'warning');
            return;
        }
        q.options.splice(optIndex, 1);
        renderQuestionsList();
    };

    window.addStatement = function(qIndex) {
        const q = questions[qIndex];
        if (!q) return;
        if (!Array.isArray(q.options)) q.options = [];
        if (q.options.length >= 5) {
            UI.showToast('Maksimal 5 pernyataan per soal.', 'warning');
            return;
        }
        const nextId = String(q.options.length + 1);
        q.options.push({ id: nextId, text: '' });
        if (typeof q.correctAnswer !== 'object' || !q.correctAnswer || Array.isArray(q.correctAnswer)) {
            q.correctAnswer = {};
        }
        q.correctAnswer[nextId] = 'TRUE';
        renderQuestionsList();
    };

    window.removeStatement = function(qIndex, sIndex) {
        const q = questions[qIndex];
        if (!q || !Array.isArray(q.options)) return;
        if (q.options.length <= 1) {
            UI.showToast('Minimal harus ada 1 pernyataan.', 'warning');
            return;
        }
        q.options.splice(sIndex, 1);
        // Re-index statements to 1, 2, 3...
        const oldKeyMap = (typeof q.correctAnswer === 'object' && q.correctAnswer && !Array.isArray(q.correctAnswer)) ? q.correctAnswer : {};
        const newKeyMap = {};
        q.options.forEach((opt, idx) => {
            const oldId = opt.id;
            const newId = String(idx + 1);
            opt.id = newId;
            newKeyMap[newId] = oldKeyMap[oldId] || 'TRUE';
        });
        q.correctAnswer = newKeyMap;
        renderQuestionsList();
    };

    window.updateStatementText = function(qIndex, sIndex, text) {
        if (questions[qIndex] && questions[qIndex].options && questions[qIndex].options[sIndex]) {
            questions[qIndex].options[sIndex].text = text;
        }
    };

    window.setStatementKey = function(qIndex, sId, keyVal) {
        const q = questions[qIndex];
        if (!q) return;
        if (typeof q.correctAnswer !== 'object' || !q.correctAnswer || Array.isArray(q.correctAnswer)) {
            q.correctAnswer = {};
        }
        q.correctAnswer[sId] = keyVal;
    };

    window.updateQuestionField = function(index, field, value) {
        if (questions[index]) {
            questions[index][field] = value;
        }
    };

    window.updateOptionText = function(qIndex, optIndex, value) {
        if (questions[qIndex] && questions[qIndex].options[optIndex]) {
            questions[qIndex].options[optIndex].text = value;
        }
    };

    window.updateOptionImage = function(qIndex, optIndex, value) {
        if (questions[qIndex] && questions[qIndex].options[optIndex]) {
            questions[qIndex].options[optIndex].imageUrl = formatDirectImageUrl(value);
        }
    };

    window.updateQuestionImageUrl = function(index, value) {
        if (questions[index]) {
            questions[index].imageUrl = formatDirectImageUrl(value);
            const previewContainer = document.getElementById(`imgPreview_${index}`);
            if (previewContainer) {
                if (questions[index].imageUrl) {
                    previewContainer.innerHTML = `
                        <div class="mt-2 p-2 flex items-center gap-3" style="background: #ffffff; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
                            <img src="${formatDirectImageUrl(questions[index].imageUrl)}" 
                                 referrerpolicy="no-referrer"
                                 onerror="handleImgError(this)" 
                                 style="max-height: 85px; max-width: 140px; object-fit: contain; border-radius: 4px; background: #fafafa; border: 1px solid var(--border-color);">
                            <div class="flex-1" style="min-width: 0;">
                                <div class="text-xs font-bold text-primary flex items-center gap-1">
                                    <i class="ph ph-image"></i> Gambar Terpasang
                                </div>
                                <div class="text-xs text-muted mt-0.5 truncate" style="max-width: 250px;" title="${escapeHtml(questions[index].imageUrl)}">
                                    ${escapeHtml(questions[index].imageUrl)}
                                </div>
                                <button type="button" class="btn btn-secondary btn-sm text-error mt-1.5" style="padding: 0.2rem 0.5rem; font-size: 0.75rem;" onclick="removeQuestionImage(${index})">
                                    <i class="ph ph-trash"></i> Hapus Gambar
                                </button>
                            </div>
                        </div>
                    `;
                } else {
                    previewContainer.innerHTML = '';
                }
            }
        }
    };

    window.removeQuestionImage = function(index) {
        if (questions[index]) {
            questions[index].imageUrl = '';
            renderQuestionsList();
            UI.showToast('Gambar soal berhasil dihapus.', 'info');
        }
    };

    window.handlePasteImage = async function(e, targetType, qIndex, optIndex = null) {
        const clipboardData = e.clipboardData || window.clipboardData;
        if (!clipboardData) return;

        const items = clipboardData.items;
        if (items) {
            for (let i = 0; i < items.length; i++) {
                if (items[i].type && items[i].type.indexOf('image') !== -1) {
                    e.preventDefault();
                    const file = items[i].getAsFile();
                    if (!file) continue;

                    UI.showToast('Membaca & mengunggah gambar dari clipboard...', 'info');

                    const reader = new FileReader();
                    reader.onload = async (event) => {
                        const base64 = event.target.result;
                        try {
                            const filename = 'paste_' + Date.now() + '.png';
                            const res = await api.uploadImage(AppState.user.sessionId, base64, filename, file.type || 'image/png');
                            if (res.success && res.data && res.data.url) {
                                const directUrl = formatDirectImageUrl(res.data.url);
                                if (targetType === 'question') {
                                    questions[qIndex].imageUrl = directUrl;
                                } else if (targetType === 'option' && optIndex !== null) {
                                    questions[qIndex].options[optIndex].imageUrl = directUrl;
                                }
                                renderQuestionsList();
                                UI.showToast('Gambar berhasil ditempel & disimpan!', 'success');
                            } else {
                                UI.showToast(res.message || 'Gagal mengunggah gambar clipboard.', 'error');
                            }
                        } catch (err) {
                            UI.showToast('Gagal memproses gambar: ' + err.message, 'error');
                        }
                    };
                    reader.readAsDataURL(file);
                    return;
                }
            }
        }
    };

    window.triggerClipboardPaste = async function(qIndex, optIndex = null) {
        if (!navigator.clipboard || !navigator.clipboard.read) {
            UI.showToast('Tekan Ctrl+V langsung pada kotak teks soal untuk menempel gambar.', 'info');
            return;
        }
        try {
            const clipboardItems = await navigator.clipboard.read();
            let foundImg = false;
            for (const item of clipboardItems) {
                const imgType = item.types.find(type => type.startsWith('image/'));
                if (imgType) {
                    foundImg = true;
                    UI.showToast('Mengunggah gambar dari clipboard...', 'info');
                    const blob = await item.getType(imgType);
                    const reader = new FileReader();
                    reader.onload = async (evt) => {
                        const base64 = evt.target.result;
                        const res = await api.uploadImage(AppState.user.sessionId, base64, 'paste_' + Date.now() + '.png', imgType);
                        if (res.success && res.data && res.data.url) {
                            const directUrl = formatDirectImageUrl(res.data.url);
                            if (optIndex !== null) {
                                questions[qIndex].options[optIndex].imageUrl = directUrl;
                            } else {
                                questions[qIndex].imageUrl = directUrl;
                            }
                            renderQuestionsList();
                            UI.showToast('Gambar berhasil ditempel & disimpan!', 'success');
                        } else {
                            UI.showToast(res.message || 'Gagal mengunggah gambar clipboard.', 'error');
                        }
                    };
                    reader.readAsDataURL(blob);
                    break;
                }
            }
            if (!foundImg) {
                UI.showToast('Tidak ada gambar di clipboard. Copy gambar terlebih dahulu lalu tekan Ctrl+V atau klik tombol ini.', 'warning');
            }
        } catch (e) {
            UI.showToast('Silakan tekan Ctrl+V langsung pada teks pertanyaan untuk menempel gambar.', 'info');
        }
    };

    window.setSingleAnswer = function(qIndex, optId) {
        if (questions[qIndex]) {
            questions[qIndex].correctAnswer = optId;
        }
    };

    window.toggleComplexAnswer = function(qIndex, optId, isChecked) {
        const q = questions[qIndex];
        if (!q) return;
        let arr = Array.isArray(q.correctAnswer) ? q.correctAnswer : [];
        if (isChecked) {
            if (!arr.includes(optId)) arr.push(optId);
        } else {
            arr = arr.filter(id => id !== optId);
        }
        q.correctAnswer = arr;
    };

    window.triggerImageUpload = function(targetType, qIndex, optIndex = null) {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/png,image/jpeg,image/webp,image/gif';
        input.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            UI.showToast('Mengunggah gambar...', 'info');

            const reader = new FileReader();
            reader.onload = async (event) => {
                const base64 = event.target.result;
                const res = await api.uploadImage(AppState.user.sessionId, base64, file.name, file.type);
                if (res.success && res.data) {
                    UI.showToast('Gambar berhasil diunggah!', 'success');
                    const directUrl = formatDirectImageUrl(res.data.url);
                    if (targetType === 'question') {
                        questions[qIndex].imageUrl = directUrl;
                    } else if (targetType === 'option') {
                        questions[qIndex].options[optIndex].imageUrl = directUrl;
                    }
                    renderQuestionsList();
                } else {
                    UI.showToast(res.message || 'Gagal mengunggah gambar', 'error');
                }
            };
            reader.readAsDataURL(file);
        };
        input.click();
    };

    window.renderQuestionsList = function() {
        const container = document.getElementById('questionsListContainer');
        if (!container) return;

        let cardsHtml = '';

            return;
        }
        try {
            const headers = [
                "Nomor Urut", "Tipe Soal", "Teks Soal", "URL Gambar Soal",
                "Opsi A", "Opsi B", "Opsi C", "Opsi D", "Opsi E", 
                "Kunci Jawaban", "Bobot Poin", "Pembahasan"
            ];
            const sampleData = [
                headers,
                [1, "MCQ", "Ibu kota negara Indonesia saat ini adalah...", "", "Jakarta", "Bandung", "Surabaya", "Nusantara", "Medan", "A", 10, "Ibu kota Indonesia saat ini adalah DKI Jakarta."],
                [2, "TRUE_FALSE", "Seorang murid memperkirakan banyaknya penonton suatu video di media sosial. Tentukan Benar atau Salah untuk setiap pernyataan berikut!", "", "Video tersebut hanya ditonton oleh 3.000 penonton setelah tepat 24 jam diunggah.", "Banyaknya penonton video meningkat dua kali lipat dari hari sebelumnya untuk beberapa hari setelah diunggah.", "Model banyaknya penonton ini tidak tepat untuk waktu yang cukup besar.", "", "", "B,B,S", 10, "Pernyataan 1 Benar, Pernyataan 2 Benar, Pernyataan 3 Salah."],
                [3, "MCQ_COMPLEX", "Manakah dari teknologi berikut yang merupakan bahasa web frontend? (Pilih semua yang benar)", "", "HTML", "CSS", "JavaScript", "Python", "C++", "A,B,C", 15, "HTML, CSS, dan JavaScript adalah pilar teknologi web browser frontend."]

            const ws = XLSX.utils.aoa_to_sheet(sampleData);
            const wb = XLSX.utils.book_new();

    window.handleExcelFile = function(e) {
        const file = e.target.files[0];
        if (!file) return;

        if (typeof XLSX === 'undefined') {
            UI.showToast('Library Excel belum siap. Silakan refresh halaman.', 'error');
            return;
        }

        const previewEl = document.getElementById('importPreviewArea');
        if (previewEl) {
            previewEl.innerHTML = `
                <div class="text-center p-4">
                    <div class="spinner mb-2"></div>
                    <p class="text-xs mt-2">Menganalisis baris soal dalam file Excel...</p>
                </div>
            `;
        }

        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const data = new Uint8Array(evt.target.result);
                const wb = XLSX.read(data, {type: 'array'});
                const firstSheetName = wb.SheetNames[0];
                const ws = wb.Sheets[firstSheetName];
                const rows = XLSX.utils.sheet_to_json(ws, {header: 1});

                if (!rows || rows.length <= 1) {
                    if (previewEl) {
                        previewEl.innerHTML = `<div class="card p-3 text-error text-center text-xs">File Excel kosong atau tidak memiliki baris data.</div>`;
                    }
                    return;
                }

                // Detect header row
                let headerRowIndex = -1;
                for (let i = 0; i < Math.min(rows.length, 5); i++) {
                    const rStr = (rows[i] || []).join(' ').toLowerCase();
                    if (rStr.includes('tipe') || rStr.includes('soal') || rStr.includes('kunci') || rStr.includes('pertanyaan')) {
                        headerRowIndex = i;
                        break;
                    }
                }
                if (headerRowIndex === -1) headerRowIndex = 0;

                const headerRow = (rows[headerRowIndex] || []).map(c => String(c || '').trim().toLowerCase());
                
                // Robust column finder: exact match first, then substring match with strict exclusions
                const getCol = (exactList, substringList, excludeList = []) => {
                    // 1. Check exact matches first
                    for (let i = 0; i < headerRow.length; i++) {
                        const h = headerRow[i];
                        if (excludeList.some(ex => h.includes(ex))) continue;
                        if (exactList.includes(h)) return i;
                    }
                    // 2. Check substring matches with exclusions
                    for (let i = 0; i < headerRow.length; i++) {
                        const h = headerRow[i];
                        if (excludeList.some(ex => h.includes(ex))) continue;
                        if (substringList.some(sub => h.includes(sub))) return i;
                    }
                    return -1;
                };

                const colType = getCol(
                    ['tipe soal', 'tipe', 'type', 'jenis soal', 'jenis'], 
                    ['tipe', 'type', 'jenis']
                );
                let colText = getCol(
                    ['teks pertanyaan', 'teks soal', 'pertanyaan', 'soal', 'isi soal', 'pertanyaan soal', 'question'], 
                    ['pertanyaan', 'teks', 'question'], 
                    ['tipe', 'type', 'gambar', 'image', 'foto', 'bobot', 'nilai', 'skor', 'nomor', 'no', 'kunci']
                );
                const colImg = getCol(
                    ['url gambar soal', 'url gambar', 'gambar soal', 'gambar', 'image', 'foto', 'link gambar', 'url foto'], 
                    ['gambar', 'image', 'foto']
                );
                const colKey = getCol(
                    ['kunci jawaban', 'kunci', 'jawaban benar', 'kunci soal', 'key', 'answer'], 
                    ['kunci', 'key']
                );
                const colScore = getCol(
                    ['bobot nilai', 'bobot poin', 'bobot', 'poin', 'nilai', 'skor', 'score', 'points'], 
                    ['bobot', 'poin', 'skor'], 
                    ['metode', 'kunci']
                );
                const colOptA = getCol(
                    ['opsi a', 'pilihan a', 'opt a', 'a', 'jawaban a'], 
                    ['opsi a', 'pilihan a', 'opt a']
                );
                const colOptB = getCol(
                    ['opsi b', 'pilihan b', 'opt b', 'b', 'jawaban b'], 
                    ['opsi b', 'pilihan b', 'opt b']
                );
                const colOptC = getCol(
                    ['opsi c', 'pilihan c', 'opt c', 'c', 'jawaban c'], 
                    ['opsi c', 'pilihan c', 'opt c']
                );
                const colOptD = getCol(
                    ['opsi d', 'pilihan d', 'opt d', 'd', 'jawaban d'], 
                    ['opsi d', 'pilihan d', 'opt d']
                );
                const colOptE = getCol(
                    ['opsi e', 'pilihan e', 'opt e', 'e', 'jawaban e'], 
                    ['opsi e', 'pilihan e', 'opt e']
                );
                const colExp = getCol(
                    ['pembahasan', 'penjelasan', 'keterangan', 'explanation'], 
                    ['pembahasan', 'penjelasan', 'keterangan']
                );

                // Safety guard: colText and colType must NEVER be the same column
                if (colText === colType || colText === -1) {
                    colText = (colType === 1) ? 2 : 1;
                }

                const hasExplicitImgCol = colImg !== -1;
                const dataRows = rows.slice(headerRowIndex + 1);
                const parsed = [];

                dataRows.forEach((row, idx) => {
                    if (!row || row.length === 0) return;

                    const getVal = (colIdx, fallbackIdx) => {
                        const target = (colIdx !== -1) ? colIdx : fallbackIdx;
                        return (target !== -1 && target < row.length && row[target] !== undefined && row[target] !== null) 
                            ? String(row[target]).trim() 
                            : '';
                    };

                    const questionText = getVal(colText, 2);
                    if (!questionText) return;

                    const typeRaw = getVal(colType, 1).toUpperCase();
                    let type = 'MCQ';
                    if (typeRaw.includes('TRUE') || typeRaw.includes('SALAH') || typeRaw.includes('BENAR')) {
                        type = 'TRUE_FALSE';
                    } else if (typeRaw.includes('KOMPLEKS') || typeRaw.includes('COMPLEX')) {
                        type = 'MCQ_COMPLEX';
                    }

                    // Handle options offset based on whether image column was present
                    const rawImg = hasExplicitImgCol ? getVal(colImg, -1) : '';
                    const optA = getVal(colOptA, hasExplicitImgCol ? 4 : 3);
                    const optB = getVal(colOptB, hasExplicitImgCol ? 5 : 4);
                    const optC = getVal(colOptC, hasExplicitImgCol ? 6 : 5);
                    const optD = getVal(colOptD, hasExplicitImgCol ? 7 : 6);
                    const optE = getVal(colOptE, hasExplicitImgCol ? 8 : 7);
                    const rawKey = getVal(colKey, hasExplicitImgCol ? 9 : 8) || 'A';
                    const score = Number(getVal(colScore, hasExplicitImgCol ? 10 : 9)) || 10;
                    const explanation = getVal(colExp, hasExplicitImgCol ? 11 : 10);

                    let options = [];
                    let correctAnswer = null;

                    if (type === 'TRUE_FALSE') {
                        const rawOptions = [optA, optB, optC, optD, optE].filter(o => o && String(o).trim());
                        let statements = [];

                        // Check if legacy Excel where optA='Benar' & optB='Salah' & no optC
                        if (rawOptions.length === 2 && rawOptions[0].trim().toLowerCase() === 'benar' && rawOptions[1].trim().toLowerCase() === 'salah') {
                            statements.push({ id: '1', text: questionText });
                        } else if (rawOptions.length > 0) {
                            rawOptions.slice(0, 5).forEach((st, sIdx) => {
                                statements.push({ id: String(sIdx + 1), text: String(st).trim() });
                            });
                        } else {
                            statements.push({ id: '1', text: 'Pernyataan 1' });
                        }
                        options = statements;

                        // Parse keys e.g. "B,B,S" or "Benar,Benar,Salah" or "TRUE,TRUE,FALSE" or "B,S,B"
                        const keyTokens = String(rawKey || '').split(/[,; ]+/).filter(Boolean);
                        const keyMap = {};
                        statements.forEach((st, sIdx) => {
                            const tok = (keyTokens[sIdx] || keyTokens[0] || 'B').trim().toUpperCase();
                            if (tok === 'S' || tok === 'SALAH' || tok === 'FALSE') {
                                keyMap[st.id] = 'FALSE';
                            } else {
                                keyMap[st.id] = 'TRUE';
                            }
                        });
                        correctAnswer = keyMap;
                    } else if (type === 'MCQ_COMPLEX') {
                        if (optA) options.push({ id: 'A', text: optA, imageUrl: '' });
                        if (optB) options.push({ id: 'B', text: optB, imageUrl: '' });
                        if (optC) options.push({ id: 'C', text: optC, imageUrl: '' });
                        if (optD) options.push({ id: 'D', text: optD, imageUrl: '' });
                        if (optE) options.push({ id: 'E', text: optE, imageUrl: '' });
                        correctAnswer = rawKey.toUpperCase().split(/[,; ]+/).filter(Boolean);
                    } else {
                        if (optA) options.push({ id: 'A', text: optA, imageUrl: '' });
                        if (optB) options.push({ id: 'B', text: optB, imageUrl: '' });
                        if (optC) options.push({ id: 'C', text: optC, imageUrl: '' });
                        if (optD) options.push({ id: 'D', text: optD, imageUrl: '' });
                        if (optE) options.push({ id: 'E', text: optE, imageUrl: '' });
                        correctAnswer = rawKey.toUpperCase().charAt(0) || 'A';
                    }

                    parsed.push({
                        id: 'Q_' + Math.floor(Math.random() * 90000 + 10000),
                        type: type,
                        text: questionText,
                        imageUrl: formatDirectImageUrl(rawImg),
                        score: score,
                        options: options,
                        correctAnswer: correctAnswer,
                        scoringMethod: 'EXACT',
                        explanation: explanation
                    });
                });

                if (parsed.length === 0) {
                    if (previewEl) {
                        previewEl.innerHTML = `<div class="card p-3 text-error text-center text-xs">Tidak ditemukan baris soal yang valid dalam file Excel.</div>`;
                    }
                    return;
                }

                pendingImportQuestions = parsed;
                if (previewEl) {
                    previewEl.innerHTML = `
                        <div class="card p-3 mb-3" style="background: var(--primary-50); border-color: var(--primary-200);">
                            <div class="flex items-center gap-2 text-primary font-bold">
                                <i class="ph ph-check-circle" style="font-size: 1.25rem;"></i> Ditemukan ${parsed.length} Soal Valid
                            </div>
                            <p class="text-xs text-secondary mt-1">Total Poin: <strong>${parsed.reduce((a,c) => a + c.score, 0)}</strong> poin • Format terverifikasi.</p>
                        </div>
                        <div style="max-height: 160px; overflow-y: auto; font-size: 0.82rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 0.5rem; background: #ffffff;">
                            ${parsed.map((pq, pi) => `
                                <div class="py-1.5 px-2 flex justify-between items-center" style="border-bottom: 1px solid var(--border-color); gap: 0.5rem;">
                                    <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0;">
                                        <strong>#${pi+1}</strong> [${pq.type}] ${escapeHtml(pq.text)}
                                    </span>
                                    <span class="badge badge-active text-xs" style="flex-shrink: 0;">${pq.score} Poin</span>
                                </div>
                            `).join('')}
                        </div>
                        <div style="padding: 1rem 0 3rem 0;">
                            <button id="confirmImportBtn" class="btn btn-primary w-full justify-center" onclick="confirmImportQuestions()" style="padding: 0.8rem 1rem; font-size: 0.95rem; font-weight: 600;">
                                <i class="ph ph-plus"></i> Tambahkan ${parsed.length} Soal ke Ujian

                        if (btn) btn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }, 120);
                }
            } catch (err) {

                if (previewEl) {
                    previewEl.innerHTML = `<div class="card p-3 text-error text-center text-xs">Gagal membaca file Excel: ${err.message}</div>`;

            }

window.showStudentDetail = async function(attemptId) {
    if (!attemptId) return;

    UI.showModal(`
        <div class="text-center py-6">
            <i class="ph ph-spinner ph-spin text-primary" style="font-size: 2.5rem;"></i>
            <p class="mt-3 text-sm text-muted">Memuat rincian lembar jawaban siswa...</p>
        </div>
    `);

    try {
        const res = await api.getStudentAttemptDetail(AppState.user.sessionId, attemptId);
        if (!res.success || !res.data) {
            UI.showToast(res.message || 'Gagal memuat detail jawaban.', 'error');
            closeModal();
            return;
        }

        const data = res.data;
        const att = data.attempt || {};
        const qList = data.questions || [];

        const formatAnswerBadges = (rawAns, options, qType = null) => {
            if (rawAns === null || rawAns === undefined || rawAns === '') {
                if (qType === 'TRUE_FALSE') {
                    rawAns = 'FALSE';
                } else {
                    return '<span class="text-muted italic">- Belum dijawab -</span>';
                }
            }
            let list = [];
            if (Array.isArray(rawAns)) {
                list = rawAns;
            } else {
                const s = String(rawAns).trim();
                if (s.startsWith('[') && s.endsWith(']')) {
                    try {
                        const parsed = JSON.parse(s);
                        if (Array.isArray(parsed)) list = parsed;
                        else list = [s];
                    } catch (e) {
                        list = s.replace(/[\[\]"]/g, '').split(',').map(x => x.trim()).filter(Boolean);
                    }
                } else if (s.includes(',')) {
                    list = s.split(',').map(x => x.trim()).filter(Boolean);
                } else {
                    list = [s];
                }
            }

            if (list.length === 0) {
                return '<span class="text-muted italic">- Belum dijawab -</span>';
            }

            return list.map(ansId => {
                const cleanId = String(ansId).trim().replace(/^["']|["']$/g, '');
                const upperId = cleanId.toUpperCase();
                const opt = options ? options.find(o => String(o.id).trim().toUpperCase() === upperId) : null;
                if (opt) {
                    return `<span><strong>${escapeHtml(cleanId)}.</strong> ${escapeHtml(opt.text)}</span>`;
                }
                if (upperId === 'TRUE' || upperId === 'BENAR' || upperId === 'B') return '<span class="font-semibold text-success">TRUE. Benar</span>';
                if (upperId === 'FALSE' || upperId === 'SALAH' || upperId === 'S') return '<span class="font-semibold text-error">FALSE. Salah</span>';
                return `<span><strong>${escapeHtml(cleanId)}</strong></span>`;
            }).join(' <span class="text-muted" style="margin: 0 4px;">•</span> ');
        };

        const questionsHtml = qList.map(q => {
            const isCorr = q.isCorrect;
            const typeLabel = q.type === 'MCQ' ? 'Pilihan Ganda' : (q.type === 'TRUE_FALSE' ? 'Benar / Salah' : 'Pilihan Ganda Kompleks');

            const studentAnsText = formatAnswerBadges(q.studentAnswer, q.options, q.type);
            const keyText = formatAnswerBadges(q.correctAnswer, q.options, q.type);

            return `
                <div class="student-q-item ${isCorr ? 'correct-item' : 'wrong-item'}">
                    <div class="flex justify-between items-center mb-2" style="flex-wrap: wrap; gap: 0.5rem;">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-sm text-primary">Soal #${q.orderNo}</span>
                            <span class="badge text-xs" style="background: var(--bg-base);">${typeLabel}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="badge ${isCorr ? 'badge-active' : 'badge-archived'} text-xs">
                                ${isCorr ? '<i class="ph ph-check-circle"></i> BENAR' : '<i class="ph ph-x-circle"></i> SALAH'}
                            </span>
                            <span class="text-xs font-bold ${isCorr ? 'text-success' : 'text-error'}">
                                ${q.awardedScore} / ${q.score} Poin
                            </span>
                        </div>
                    </div>

                    <div class="text-sm font-medium mb-3" style="line-height: 1.5; color: var(--text-primary); word-break: break-word; overflow-wrap: anywhere;">
                        ${escapeHtml(q.questionText)}
                    </div>

                    ${(q.questionImageUrl || q.imageUrl) ? `
                        <div class="mb-3 text-center">
                            <img src="${formatDirectImageUrl(q.questionImageUrl || q.imageUrl)}" 
                                 alt="Gambar Soal" 
                                 referrerpolicy="no-referrer"
                                 loading="lazy"
                                 onerror="handleImgError(this)"
                                 style="max-width: 100%; max-height: 220px; object-fit: contain; border-radius: var(--radius-sm); border: 1px solid var(--border-color); background: #ffffff; display: inline-block;">
                        </div>
                    ` : ''}

                    ${q.bottomText ? `
                        <div class="text-sm font-medium mb-3" style="line-height: 1.5; color: var(--text-primary); word-break: break-word; overflow-wrap: anywhere;">
                            ${escapeHtml(q.bottomText)}
                        </div>
                    ` : ''}

                    ${q.type === 'TRUE_FALSE' ? (() => {
                        let sMap = {};
                        if (typeof q.studentAnswer === 'object' && q.studentAnswer !== null) {
                            sMap = q.studentAnswer;
                        } else if (typeof q.studentAnswer === 'string' && q.studentAnswer.trim().startsWith('{')) {
                            try { sMap = JSON.parse(q.studentAnswer); } catch (e) { sMap = {}; }
                        } else if (q.studentAnswer) {
                            sMap = { '1': q.studentAnswer };
                        }

                        let cMap = {};
                        if (typeof q.correctAnswer === 'object' && q.correctAnswer !== null) {
                            cMap = q.correctAnswer;
                        } else if (typeof q.correctAnswer === 'string' && q.correctAnswer.trim().startsWith('{')) {
                            try { cMap = JSON.parse(q.correctAnswer); } catch (e) { cMap = {}; }
                        } else if (q.correctAnswer) {
                            cMap = { '1': q.correctAnswer };
                        }

                        let statements = q.options || [];
                        if (statements.length === 2 && (statements[0].id === 'TRUE' || statements[0].text === 'Benar')) {
                            statements = [{ id: '1', text: q.questionText }];
                        }

                        return `
                            <div style="overflow-x: auto; margin-top: 0.5rem; margin-bottom: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-md); background: #ffffff;">
                                <table style="width: 100%; border-collapse: collapse; font-size: 0.84rem; text-align: left;">
                                    <thead>
                                        <tr style="background: #e0f2fe; color: #0369a1; border-bottom: 2px solid #bae6fd;">
                                            <th style="padding: 8px 12px; width: 35px; text-align: center;">No</th>
                                            <th style="padding: 8px 12px;">Pernyataan</th>
                                            <th style="padding: 8px 12px; width: 110px; text-align: center;">Jawaban Siswa</th>
                                            <th style="padding: 8px 12px; width: 100px; text-align: center;">Kunci Resmi</th>
                                            <th style="padding: 8px 12px; width: 85px; text-align: center;">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${statements.map((st, sIdx) => {
                                            let sVal = (sMap && sMap[st.id] !== undefined) ? String(sMap[st.id]).trim().toUpperCase() : '';
                                            let cVal = (cMap && cMap[st.id] !== undefined) ? String(cMap[st.id]).trim().toUpperCase() : '';
                                            if (sVal === 'BENAR' || sVal === 'B') sVal = 'TRUE';
                                            if (sVal === 'SALAH' || sVal === 'S') sVal = 'FALSE';
                                            if (cVal === 'BENAR' || cVal === 'B') cVal = 'TRUE';
                                            if (cVal === 'SALAH' || cVal === 'S') cVal = 'FALSE';

                                            const isStmtCorrect = sVal && cVal && sVal === cVal;
                                            const sText = sVal === 'TRUE' ? '<span class="text-success font-semibold">Benar</span>' : (sVal === 'FALSE' ? '<span class="text-error font-semibold">Salah</span>' : '<span class="text-muted italic">-</span>');
                                            const cText = cVal === 'TRUE' ? '<span class="text-success font-semibold">Benar</span>' : (cVal === 'FALSE' ? '<span class="text-error font-semibold">Salah</span>' : '-');

                                            return `
                                                <tr style="border-bottom: 1px solid var(--border-color); background: ${sIdx % 2 === 0 ? '#ffffff' : 'var(--bg-base)'};">
                                                    <td style="padding: 8px 12px; text-align: center; font-weight: bold; color: var(--text-secondary); vertical-align: middle;">${sIdx + 1}</td>

                                                    <td style="padding: 8px 12px; text-align: center; vertical-align: middle;">${sText}</td>
                                                    <td style="padding: 8px 12px; text-align: center; vertical-align: middle;">${cText}</td>
                                                    <td style="padding: 8px 12px; text-align: center; vertical-align: middle;">
                                                        <span class="badge ${isStmtCorrect ? 'badge-active' : 'badge-archived'}" style="font-size: 0.72rem; padding: 2px 6px;">

                                                        </span>
                                                    </td>
                                                </tr>
                                            `;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        `;
                    })() : `
                        <!-- Jawaban Siswa -->
                        <div class="ans-box ${isCorr ? 'ans-box-student-correct' : 'ans-box-student-wrong'}">
                            <div class="ans-icon-wrap">
                                <i class="ph ${isCorr ? 'ph-check-circle' : 'ph-x-circle'}" style="font-size: 1.25rem;"></i>
                            </div>
                            <div class="ans-content-wrap">
                                <div class="text-xs font-bold" style="text-transform: uppercase; letter-spacing: 0.04em;">Jawaban Siswa:</div>
                                <div class="font-medium mt-1" style="font-size: 0.92rem; line-height: 1.5;">${studentAnsText}</div>
                            </div>
                        </div>

                        <!-- Kunci Jawaban Resmi Guru -->
                        <div class="ans-box ans-box-key">
                            <div class="ans-icon-wrap">
                                <i class="ph ph-key" style="font-size: 1.25rem;"></i>
                            </div>
                            <div class="ans-content-wrap">
                                <div class="text-xs font-bold" style="text-transform: uppercase; letter-spacing: 0.04em;">Kunci Jawaban Resmi:</div>
                                <div class="font-medium mt-1" style="font-size: 0.92rem; line-height: 1.5;">${keyText}</div>
                            </div>
                        </div>
                    `}

                    ${q.explanation ? `
                        <div class="mt-2.5 p-2.5 text-xs" style="background: var(--bg-base); border-radius: var(--radius-sm); border-left: 3px solid var(--info); color: var(--text-secondary); line-height: 1.45;">
                            <strong class="text-primary">Pembahasan:</strong> ${escapeHtml(q.explanation)}
                        </div>
                    ` : ''}
                </div>
            `;
        }).join('');

        UI.showModal(`
            <div class="attempt-detail-modal">
                <div class="flex justify-between items-center mb-3 pb-3" style="position: sticky; top: 0; background: #ffffff; z-index: 10; border-bottom: 1px solid var(--border-color);">
                    <div>
                        <h3 style="margin: 0; font-size: 1.2rem; color: var(--text-primary);">Lembar Jawaban Siswa</h3>
                        <p class="text-xs text-muted mt-0.5">${att.examTitle || 'Ujian Online'}</p>
                    </div>
                    <button class="btn btn-icon btn-secondary btn-sm" onclick="closeModal()" title="Tutup">
                        <i class="ph ph-x"></i>
                    </button>
                </div>

                <!-- Ringkasan Nilai & Identitas Siswa -->
                <div class="student-summary-box">
                    <div class="flex justify-between items-center" style="flex-wrap: wrap; gap: 0.75rem;">
                        <div>
                            <div class="text-base font-bold text-primary">${att.participantName}</div>
                            <div class="text-xs text-muted mt-0.5">
                                NIS: <strong>${att.nis}</strong> • Kelas: <strong>${att.className}</strong>
                            </div>
                            <div class="text-xs text-muted mt-0.5">
                                Percobaan: <strong>Ke-${att.attemptNumber || 1}</strong> • ${att.endAt ? new Date(att.endAt).toLocaleTimeString('id-ID', {hour: '2-digit', minute: '2-digit'}) : '-'}
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="text-xs text-muted">Nilai (KKM: ${att.kkm || 75})</div>
                            <div class="text-3xl font-black ${att.finalScore >= (att.kkm || 75) ? 'text-success' : 'text-error'}" style="line-height: 1.1;">
                                ${att.finalScore !== null ? att.finalScore : 0}

                            </span>
