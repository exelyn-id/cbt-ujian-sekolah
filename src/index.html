<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web App Ujian</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/css/icons.css">
    <script src="https://unpkg.com/@phosphor-icons/web" defer></script>
    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>
    
    <!-- Modal Container -->
    <div id="modal-container" class="modal-container hidden">
        <div class="modal-overlay" onclick="closeModal()"></div>
        <div class="modal-content" id="modal-body"></div>
    </div>

    <!-- App Container (Dynamic Views injected here) -->
    <div id="app" class="app-container">
        <div class="loading-full">
            <i class="ph ph-spinner ph-spin"></i> <span>Memuat Aplikasi...</span>
        </div>
    </div>

    <!-- Core Scripts -->
    <script src="js/state.js"></script>
    <script src="js/api-mock.js"></script>
    <script src="js/router.js"></script>
    
    <!-- View Scripts -->
    <script src="js/views/teacher-login.js"></script>
    <script src="js/views/teacher-dashboard.js"></script>
    <script src="js/views/exam-editor.js"></script>
    <script src="js/views/question-builder.js"></script>
    <script src="js/views/teacher-results.js"></script>
    <script src="js/views/student-landing.js"></script>
    <script src="js/views/student-exam.js"></script>
    <script src="js/views/student-result.js"></script>
    
    <!-- Bootstrapper -->
    <script src="js/app.js"></script>
</body>
</html>
